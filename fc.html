<script>
const API_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
const HIT_URL = 'https://sayan-prime.pages.dev/api/hit?key=Fancode_inc';
const PLAYER_PAGE = 'play.html';
const FALLBACK_IMG = '/gop-gop-moww.png';
const REFRESH_MS = 60000;
const IST_OFFSET_MIN = 330;
const RTL_LANGS = ['ur', 'ks', 'sd'];
const GT_CODES = { mni: 'mni-Mtei' };
const LANGS = [
  ['en','English'],['hi','हिन्दी'],['bn','বাংলা'],['ta','தமிழ்'],['te','తెలుగు'],['ml','മലയാളം'],
  ['kn','ಕನ್ನಡ'],['mr','मराठी'],['gu','ગુજરાતી'],['pa','ਪੰਜਾਬੀ'],['or','ଓଡ଼ିଆ'],['as','অসমীয়া'],
  ['ur','اردو'],['mai','मैथिली'],['kok','कोंकणी'],['ne','नेपाली'],['bho','भोजपुरी'],['doi','डोगरी'],
  ['sa','संस्कृतम्'],['sd','سنڌي'],['ks','کٲشُر'],['mni','মৈতৈলোন্'],['sat','ᱥᱟᱱᱛᱟᱲᱤ']
];
const LANG_CODES = {
  ENGLISH:'eng', HINDI:'hin', BANGLA:'ban', BENGALI:'ban', TAMIL:'tam', TELUGU:'tel',
  KANNADA:'kan', MARATHI:'mar', MALAYALAM:'mal', PUNJABI:'pan', GUJARATI:'guj',
  URDU:'urd', ODIA:'ori', ASSAMESE:'asm', BHOJPURI:'bho'
};
const UI = {
  watch:'Watch Now', allLive:'All Live Now', liveUpcoming:'Live & Upcoming', allUpcoming:'All Upcoming Matches',
  liveFor:'Live for', live:'Live', upcoming:'Upcoming', ended:'Ended', today:'Today',
  tba:'Time to be announced', empty:'No matches found.', failed:'Couldn’t load matches. Please try again.',
  updated:'Updated', visitors:'Live visitors', loading:'Loading matches…', audio:'Broadcast language',
  notLive:'This match is not live yet.', startsAt:'Starts', copied:'The stream link has been copied to your clipboard.',
  openAnyway:'Open the stream page anyway?'
};
const BG_MOBILE = 'https://wallpapercat.com/w/full/8/c/c/57325-2160x3840-mobile-4k-milky-way-background.jpg';
const BG_DESKTOP = 'https://wallpapercat.com/w/full/4/e/9/185978-3840x2160-desktop-4k-moon-background-photo.jpg';
const PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>';

const grid = document.getElementById('rows');
const heroEl = document.getElementById('hero');
const track = document.getElementById('track');
const dots = document.getElementById('dots');
const themeBtn = document.getElementById('theme');
const langSel = document.getElementById('lang');
const updEl = document.getElementById('upd');
const noteEl = document.getElementById('note');

let matches = [];
let loaded = false;
let lastSnap = '';
let updatedMs = null;
let token = 0;
let pick = {};
let trCache = {};
let seen = readJSON('fc_seen');
let lang = localStorage.getItem('fc_lang');
if (!LANGS.some(l => l[0] === lang)) lang = 'en';

function readJSON(key){
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch(e){ return {}; }
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toIstMs(y, mo, d, h, mi, s, ap){
  h = +h;
  if (ap){
    ap = ap.toUpperCase();
    if (ap === 'PM' && h < 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
  }
  return Date.UTC(+y, +mo - 1, +d, h, +mi, s ? +s : 0) - IST_OFFSET_MIN * 60000;
}

function parseIST(str){
  if (!str) return null;
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)\s+(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/i);
  if (m) return toIstMs(m[7], m[6], m[5], m[1], m[2], m[3], m[4]);
  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)$/i);
  if (m) return toIstMs(m[3], m[2], m[1], m[4], m[5], m[6], m[7]);
  const t = Date.parse(s);
  return isNaN(t) ? null : t;
}

function langCode(raw){
  const l = String(raw || '').trim().toUpperCase();
  if (!l || l === 'BLOODY_SWEET') return 'eng';
  return LANG_CODES[l] || l.slice(0, 3).toLowerCase();
}

function playerUrl(id, code){
  return PLAYER_PAGE + '?id=' + encodeURIComponent(id + '_' + code) + '&s=0';
}

function fmtElapsed(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s % 3600 / 60)) + ':' + p(s % 60);
}

function tick(){
  const now = Date.now();
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmtElapsed(now - Number(el.dataset.since));
  });
}

function trMap(l){
  if (!trCache[l]) trCache[l] = readJSON('fc_tr_' + l);
  return trCache[l];
}

function t(text){
  if (lang === 'en' || !text) return text;
  return trMap(lang)[text] || text;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchGT(text, l){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 9000);
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=' +
      encodeURIComponent(GT_CODES[l] || l) + '&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    return (Array.isArray(data[0]) ? data[0] : []).map(p => (p && p[0]) || '').join('');
  } catch(e){
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function translateChunk(chunk, l){
  for (let a = 0; a < 2; a++){
    const out = await fetchGT(chunk.join('\n'), l);
    if (out !== null){
      const lines = out.trim().split('\n').map(x => x.trim());
      if (lines.length === chunk.length && lines.every(Boolean)) return lines;
    }
    await sleep(400 * (a + 1));
  }
  const result = [];
  for (const text of chunk){
    let out = await fetchGT(text, l);
    if (out === null){ await sleep(300); out = await fetchGT(text, l); }
    result.push(out && out.trim() ? out.trim() : null);
  }
  return result;
}

async function translateMissing(texts, l){
  const map = trMap(l);
  const todo = [...new Set(texts.map(x => String(x || '').replace(/\s*\n\s*/g, ' ').trim()))].filter(x => x && !(x in map));
  if (!todo.length) return true;
  const chunks = [];
  let cur = [], size = 0;
  todo.forEach(x => {
    const n = encodeURIComponent(x).length + 3;
    if (cur.length && size + n > 1400){ chunks.push(cur); cur = []; size = 0; }
    cur.push(x);
    size += n;
  });
  if (cur.length) chunks.push(cur);
  let failed = 0, next = 0;
  const worker = async () => {
    while (next < chunks.length){
      const chunk = chunks[next++];
      const out = await translateChunk(chunk, l);
      chunk.forEach((x, i) => { if (out[i]) map[x] = out[i]; else failed++; });
    }
  };
  await Promise.all(Array.from({ length: Math.min(3, chunks.length) }, worker));
  try { localStorage.setItem('fc_tr_' + l, JSON.stringify(map)); } catch(e){}
  return failed === 0;
}

function collectTexts(){
  const out = Object.values(UI);
  matches.forEach(m => {
    out.push(...m.teams, m.tournament);
    m.bc.forEach(b => out.push(capital(b.name)));
  });
  return out;
}

function capital(s){
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

function note(text){
  noteEl.textContent = text;
}

function locale(){
  try {
    const l = GT_CODES[lang] ? 'en' : lang;
    return Intl.DateTimeFormat.supportedLocalesOf([l]).length ? l : 'en';
  } catch(e){
    return 'en';
  }
}

function whenText(m){
  if (!m.startMs) return t(UI.tba);
  const d = new Date(m.startMs);
  const loc = locale();
  const time = d.toLocaleTimeString(loc, { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === new Date().toDateString()) return t(UI.today) + ', ' + time;
  return d.toLocaleDateString(loc, { day: 'numeric', month: 'short' }) + ', ' + time;
}

function paintStatic(){
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(UI[el.dataset.i]); });
  if (updatedMs){
    updEl.textContent = t(UI.updated) + ' ' +
      new Date(updatedMs).toLocaleTimeString(locale(), { hour: 'numeric', minute: '2-digit' });
  }
}

function teamsOf(title){
  const p = String(title).split(/\s+vs\.?\s+/i);
  return p.length === 2 ? p.map(x => x.trim()) : [String(title)];
}

function teamsHtml(m){
  const tm = m.teams.map(x => '<div class="tm">' + esc(t(x)) + '</div>');
  return tm.length === 2 ? tm[0] + '<div class="vs"><span>v</span></div>' + tm[1] : tm[0];
}

function actions(m){
  const since = m.startMs || seen[m.id] || Date.now();
  const chosen = pick[m.id] || (m.bc[0] && m.bc[0].code);
  const select = m.bc.length > 1
    ? '<select class="bc" data-id="' + esc(m.id) + '" aria-label="' + esc(t(UI.audio)) + '">' +
      m.bc.map(b => '<option value="' + esc(b.code) + '"' + (b.code === chosen ? ' selected' : '') + '>' +
        esc(t(capital(b.name))) + '</option>').join('') + '</select>'
    : '';
  return '<div class="timer"><span>' + esc(t(UI.liveFor)) + '</span><b data-since="' + since + '">' +
    fmtElapsed(Date.now() - since) + '</b></div>' + select +
    '<button type="button" class="watch" data-id="' + esc(m.id) + '"' + (m.canWatch ? '' : ' disabled') + '>' +
    PLAY_ICON + '<span>' + esc(t(UI.watch)) + '</span></button>';
}

function imgTag(m, cls, eager){
  return '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + esc(m.image) + '" alt="' + esc(m.teams.join(' vs ')) +
    '" decoding="async"' + (eager ? '' : ' loading="lazy"') + ' onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">';
}

function slide(m, i){
  const tour = esc(t(m.tournament));
  return '<article class="slide"><img class="hbg" src="' + esc(m.image) + '" alt="" aria-hidden="true" loading="lazy" decoding="async" onerror="this.remove()">' +
    imgTag(m, 'himg', i === 0) + '<div class="shade"></div><div class="sbody">' +
    (tour ? '<div class="stour">' + tour + '</div>' : '') + teamsHtml(m) +
    (m.status === 'LIVE' ? actions(m) : '<div class="swhen">' + esc(whenText(m)) + '</div>') + '</div></article>';
}

function card(m){
  const live = m.status === 'LIVE';
  const tour = esc(t(m.tournament));
  const badge = live
    ? '<span class="badge lv"><i></i>' + esc(t(UI.live)) + '</span>'
    : '<span class="badge">' + esc(t(m.status === 'COMPLETED' ? UI.ended : UI.upcoming)) + '</span>';
  return '<article class="card"' + (m.status === 'UPCOMING' ? ' data-up="' + esc(m.id) + '"' : '') + '><div class="thumb">' +
    imgTag(m, '', false) + badge + '</div><div class="body">' +
    '<div class="tour"' + (tour ? ' title="' + tour + '"' : '') + '>' + tour + '</div>' + teamsHtml(m) +
    '<div class="foot">' + (live ? actions(m) : '<div class="when">' + esc(whenText(m)) + '</div>') + '</div></div></article>';
}

function upItem(m){
  const tour = esc(t(m.tournament));
  const off = m.status === 'COMPLETED';
  return '<div class="uitem' + (off ? ' off' : '') + '"' + (off ? '' : ' data-up="' + esc(m.id) + '"') + '>' +
    '<img class="uthumb" src="' + esc(m.image) + '" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src=\'' + FALLBACK_IMG + '\'">' +
    '<div class="ut"><div class="un">' + esc(m.teams.map(x => t(x)).join(' v ')) + '</div>' +
    (tour ? '<div class="uo">' + tour + '</div>' : '') +
    '<div class="uw">' + esc(off ? t(UI.ended) : whenText(m)) + '</div></div></div>';
}

const CHEVRON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
let upOpen = false;

function rowSection(label, list){
  return '<section><h2 class="sec">' + esc(t(label)) + ' <span>(' + list.length + ')</span></h2><div class="row">' +
    list.map(card).join('') + '</div></section>';
}

function upcomingSection(list){
  return '<div class="more"><button type="button" class="more-btn" aria-expanded="' + upOpen + '"><span>' +
    esc(t(UI.allUpcoming)) + ' (' + list.filter(m => m.status === 'UPCOMING').length + ')</span>' + CHEVRON +
    '</button><div class="ulist"' + (upOpen ? '' : ' hidden') + '>' + list.map(upItem).join('') + '</div></div>';
}

let heroCount = 0;
let heroReal = 0;
let heroDom = 0;
let heroTimer = 0;
let resumeTimer = 0;
let settleTimer = 0;
let touching = false;
let raf = 0;

function goTo(dom, smooth){
  const s = track.children[dom];
  if (!s) return;
  heroDom = dom;
  track.scrollTo({ left: s.offsetLeft - (track.clientWidth - s.clientWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
}

function jump(dom){
  track.style.scrollSnapType = 'none';
  goTo(dom, false);
  requestAnimationFrame(() => { track.style.scrollSnapType = ''; });
}

function updateActive(){
  const center = track.scrollLeft + track.clientWidth / 2;
  let best = 0, dist = Infinity;
  Array.from(track.children).forEach((s, i) => {
    const d = Math.abs(s.offsetLeft + s.clientWidth / 2 - center);
    if (d < dist){ dist = d; best = i; }
  });
  heroDom = best;
  heroReal = heroCount > 1 ? (best - 1 + heroCount) % heroCount : 0;
  Array.from(track.children).forEach((s, i) => s.classList.toggle('on', i === best));
  Array.from(dots.children).forEach((b, i) => b.classList.toggle('on', i === heroReal));
}

function settle(){
  if (heroCount < 2 || touching) return;
  if (heroDom === 0) jump(heroCount);
  else if (heroDom === heroCount + 1) jump(1);
}

function startAuto(){
  clearInterval(heroTimer);
  heroTimer = setInterval(() => {
    if (heroCount > 1 && !document.hidden && !heroEl.hidden && !touching) goTo(heroDom + 1, true);
  }, 5000);
}

function pauseAuto(){
  clearInterval(heroTimer);
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(startAuto, 8000);
}

function renderHero(){
  const list = matches.filter(m => m.status === 'LIVE')
    .concat(matches.filter(m => m.status === 'UPCOMING').slice(0, 3));
  heroEl.hidden = !loaded || !list.length;
  if (heroEl.hidden) return;
  heroCount = list.length;
  const html = list.map(slide);
  track.innerHTML = heroCount > 1 ? [html[heroCount - 1]].concat(html, [html[0]]).join('') : html.join('');
  dots.innerHTML = list.map((_, i) => '<button type="button" class="dot" data-n="' + i + '" aria-label="' + (i + 1) + '"></button>').join('');
  if (heroReal >= heroCount) heroReal = 0;
  goTo(heroCount > 1 ? heroReal + 1 : 0, false);
  updateActive();
}

function render(){
  if (!loaded) return;
  renderHero();
  const live = matches.filter(m => m.status === 'LIVE');
  const ups = matches.filter(m => m.status === 'UPCOMING');
  const ended = matches.filter(m => m.status === 'COMPLETED');
  const fill = ups.slice(0, Math.max(0, 5 - live.length));
  const first = live.concat(fill);
  if (!first.length && !ended.length){
    grid.innerHTML = '<div class="msg">' + esc(t(UI.empty)) + '</div>';
    return;
  }
  grid.innerHTML =
    (first.length ? rowSection(fill.length || !live.length ? UI.liveUpcoming : UI.allLive, first) : '') +
    (ups.length || ended.length ? upcomingSection(ups.concat(ended)) : '');
  tick();
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try {
    const a = document.createElement('textarea');
    a.value = text;
    a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a);
    a.select();
    const ok = document.execCommand('copy');
    a.remove();
    return ok;
  } catch(e){
    return false;
  }
}

async function onUpcoming(m){
  const url = new URL(playerUrl(m.id, m.code), location.href).href;
  const copied = await copyText(url);
  const msg = t(UI.notLive) + '\n\n' + m.teams.map(x => t(x)).join(' v ') + '\n' +
    t(UI.startsAt) + ': ' + whenText(m) + (copied ? '\n\n' + t(UI.copied) : '') + '\n\n' + t(UI.openAnyway);
  if (window.confirm(msg)) window.location.href = url;
}

async function translate(){
  if (lang === 'en'){ note(''); return; }
  const my = ++token;
  const l = lang;
  note('Translating…');
  let ok = false;
  for (let a = 0; a < 3 && !ok; a++){
    ok = await translateMissing(collectTexts(), l);
    if (my !== token) return;
    paintStatic();
    render();
    if (!ok){
      await sleep(2500 * (a + 1));
      if (my !== token) return;
    }
  }
  note(ok ? '' : 'Translation service is busy. Some text is shown in English.');
}

function setLang(l){
  lang = l;
  token++;
  try { localStorage.setItem('fc_lang', l); } catch(e){}
  document.documentElement.lang = l;
  document.documentElement.dir = RTL_LANGS.includes(l) ? 'rtl' : 'ltr';
  paintStatic();
  render();
  translate();
}

function build(data){
  return (data.matches || []).map(m => {
    const st = String(m.status || '').toUpperCase();
    const groups = m.auto_streams && typeof m.auto_streams === 'object' ? m.auto_streams : {};
    const s = m.streams || {};
    const bc = Object.keys(groups)
      .filter(k => groups[k] && groups[k].streams && Object.keys(groups[k].streams).length)
      .map(name => ({ name, code: langCode(name) }));
    return {
      id: String(m.match_id || ''),
      title: m.title || 'Match',
      teams: teamsOf(m.title || 'Match'),
      tournament: m.tournament || '',
      image: m.image || FALLBACK_IMG,
      status: st === 'LIVE' || st === 'COMPLETED' ? st : 'UPCOMING',
      startMs: parseIST(m.startTime),
      bc,
      code: langCode(m.language),
      canWatch: bc.length > 0 || Boolean(s.primary || s.fancode_cdn || s.fancode_lk_cdn || s.fancode_np_cdn || s.fancode_bd_cdn)
    };
  }).sort((a, b) => {
    const rank = x => x.status === 'LIVE' ? 0 : (x.status === 'UPCOMING' ? 1 : 2);
    if (rank(a) !== rank(b)) return rank(a) - rank(b);
    return (a.startMs == null ? Infinity : a.startMs) - (b.startMs == null ? Infinity : b.startMs);
  });
}

function syncSeen(list){
  const now = Date.now();
  const next = {};
  list.forEach(m => {
    if (m.status === 'LIVE' && !m.startMs) next[m.id] = seen[m.id] || now;
  });
  seen = next;
  try { localStorage.setItem('fc_seen', JSON.stringify(seen)); } catch(e){}
}

async function refresh(first){
  if (!first && document.hidden) return;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    updatedMs = parseIST(data.updatedAt) || Date.now();
    paintStatic();
    const snap = JSON.stringify(data.matches || []);
    if (snap === lastSnap) return;
    lastSnap = snap;
    matches = build(data);
    syncSeen(matches);
    loaded = true;
    render();
    translate();
  } catch(e){
    if (!loaded) grid.innerHTML = '<div class="msg">' + esc(t(UI.failed)) + '</div>';
  }
}

function loadVisitors(){
  fetch(HIT_URL, { cache: 'no-store' })
    .then(r => r.json())
    .then(d => {
      const v = d.total_formatted != null ? d.total_formatted : d.total;
      if (v == null) return;
      document.getElementById('vc').textContent = v;
      document.getElementById('vis').hidden = false;
    })
    .catch(() => {});
}

langSel.innerHTML = LANGS.map(l => '<option value="' + l[0] + '">' + l[1] + '</option>').join('');
langSel.value = lang;
langSel.addEventListener('change', () => setLang(langSel.value));

document.addEventListener('click', e => {
  const toggle = e.target.closest('.more-btn');
  if (toggle){
    upOpen = !upOpen;
    toggle.setAttribute('aria-expanded', String(upOpen));
    toggle.parentElement.querySelector('.ulist').hidden = !upOpen;
    return;
  }
  const btn = e.target.closest('.watch');
  if (btn){
    if (btn.disabled) return;
    const m = matches.find(x => x.id === btn.dataset.id);
    if (!m) return;
    const code = pick[m.id] || (m.bc[0] && m.bc[0].code) || m.code;
    window.location.href = playerUrl(m.id, code);
    return;
  }
  const up = e.target.closest('[data-up]');
  if (up){
    const m = matches.find(x => x.id === up.dataset.up);
    if (m) onUpcoming(m);
  }
});

document.addEventListener('change', e => {
  const sel = e.target.closest('.bc');
  if (!sel) return;
  pick[sel.dataset.id] = sel.value;
  document.querySelectorAll('.bc').forEach(x => { if (x.dataset.id === sel.dataset.id) x.value = sel.value; });
});

track.addEventListener('scroll', () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(updateActive);
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settle, 140);
}, { passive: true });
track.addEventListener('touchstart', () => { touching = true; pauseAuto(); }, { passive: true });
track.addEventListener('touchend', () => {
  touching = false;
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settle, 220);
}, { passive: true });
track.addEventListener('wheel', pauseAuto, { passive: true });
heroEl.addEventListener('mouseenter', () => clearInterval(heroTimer));
heroEl.addEventListener('mouseleave', startAuto);
dots.addEventListener('click', e => {
  const b = e.target.closest('.dot');
  if (b){ pauseAuto(); goTo(heroCount > 1 ? Number(b.dataset.n) + 1 : 0, true); }
});
window.addEventListener('resize', () => goTo(heroDom, false));
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('fc_theme', next); } catch(e){}
  document.querySelector('meta[name="theme-color"]').content = next === 'light' ? '#f6f0e4' : '#0e1118';
});
startAuto();

window.addEventListener('load', () => {
  const url = window.matchMedia('(max-width:767px)').matches ? BG_MOBILE : BG_DESKTOP;
  const img = new Image();
  img.onload = () => {
    const layer = document.getElementById('bgimg');
    layer.style.backgroundImage = 'url("' + url + '")';
    layer.classList.add('on');
  };
  img.src = url;
});

document.documentElement.lang = lang;
document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';
paintStatic();
refresh(true);
loadVisitors();
setInterval(tick, 1000);
setInterval(() => refresh(false), REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(); refresh(false); } });
</script>
</body>
</html>
