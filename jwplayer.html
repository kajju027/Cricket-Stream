:root { --red:#e50914; --white:#f7f7f7; --black:#181919; }
*,*::before,*::after { margin:0;padding:0;box-sizing:inherit; }
html { box-sizing:border-box;font-size:62.5%; }
body { margin:0;background:#000;width:100%;height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%; }

#splash {
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:9999;
}

.sg-out {
  position:absolute;
  width:min(560px,96vw);
  height:min(560px,96vw);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,.24) 0%,
    rgba(220,220,220,.13) 32%,
    rgba(170,170,170,.05) 62%,
    transparent 80%);
  filter:blur(62px);
  animation:sbreath 5.5s ease-in-out infinite;
  pointer-events:none;
}
.sg-in {
  position:absolute;
  width:min(230px,46vw);
  height:min(230px,46vw);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,.38) 0%,
    rgba(255,255,255,.16) 42%,
    transparent 72%);
  filter:blur(24px);
  animation:sbreath 5.5s ease-in-out infinite reverse;
  pointer-events:none;
}
@keyframes sbreath {
  0%,100% { opacity:.72;transform:scale(1); }
  50%      { opacity:1;transform:scale(1.06); }
}

.sinner {
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:flex-start;
}
.stitle {
  font-family:'Rubik',Arial,sans-serif;
  font-size:clamp(3.8rem,11vw,6.2rem);
  font-weight:700;letter-spacing:.18em;
  color:#fff;text-transform:uppercase;line-height:1;
  text-shadow:0 0 45px rgba(255,255,255,.2),0 0 90px rgba(255,255,255,.07);
}
.stitle .rx {
  color:var(--red);
  text-shadow:0 0 18px rgba(229,9,20,.55);
}
.spby {
  font-family:'Satisfy',cursive;
  font-size:clamp(1.1rem,2.8vw,1.5rem);
  color:rgba(255,255,255,.32);
  letter-spacing:.01em;
  margin-top:.7rem;
  align-self:flex-end;
  padding-right:.2rem;
}

.nf {
  position:fixed;left:50%;top:50%;
  width:68px;height:68px;margin:-34px 0 0 -34px;
  z-index:20;pointer-events:none;display:none;
}
.nf.on { display:block; }
.nf i {
  display:block;width:100%;height:100%;border-radius:50%;
  border:5px solid rgba(255,255,255,.12);border-top-color:var(--red);
  animation:nfspin 1s linear infinite;
  filter:drop-shadow(0 0 12px rgba(229,9,20,.5));
}
@supports ((mask:radial-gradient(#000,#000)) or (-webkit-mask:radial-gradient(#000,#000))) and (background:conic-gradient(#000,#fff)) {
  .nf i {
    border:0;
    background:conic-gradient(from 0deg,rgba(229,9,20,0) 0%,rgba(229,9,20,.18) 45%,#e50914 100%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
  }
}
@keyframes nfspin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion:reduce) { .nf i { animation-duration:3s; } }

#pw video { width:100%;height:100%;background:#000;object-fit:contain; }
</style>
</head>
<body>

<div class="nf" id="nf"><i></i></div>

<div id="splash">
  <div class="sg-out"></div>
  <div class="sg-in"></div>
  <div class="sinner">
    <div class="stitle">NEXUS&nbsp;<span class="rx">X</span></div>
    <div class="spby">Powered by Sonu</div>
  </div>
</div>

<div id="pw">
  <div id="pc"></div>
</div>

<script>
(function(){
  var q    = new URLSearchParams(location.search);
  var url  = q.get('url');
  var titl = q.get('title')    || '';
  var sub  = q.get('subtitle') || '';
  var logo = q.get('logo')     || '';
  var post = q.get('poster')   || '';
  var auto = q.get('autoplay') === '1';
  var img  = logo || post;

  if (!url) return;

  var ua    = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var muted = q.get('muted') === '1' || (auto && isIOS);
  var nf    = document.getElementById('nf');
  var pw    = document.getElementById('pw');
  var jw    = null;
  var waited = 0;
  var LIB_TIMEOUT = 10000;
  var MAX_RETRY = 5;
  var retries = 0;
  var fallbackStarted = false;

  if (titl) document.title = titl;
  document.getElementById('splash').style.display = 'none';
  pw.style.display = 'flex';

  function loader(on) {
    if (on) nf.classList.add('on'); else nf.classList.remove('on');
  }

  function lockLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
    } catch (e) {}
  }

  function unlockOrientation() {
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch (e) {}
  }

  function fallback() {
    if (fallbackStarted) return;
    fallbackStarted = true;
    loader(true);

    try { if (jw && jw.remove) jw.remove(); } catch (e) {}
    var pc = document.getElementById('pc');
    if (pc) pc.style.display = 'none';

    var v = document.createElement('video');
    v.controls = true;
    v.autoplay = auto;
    v.muted = muted;
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    if (img) v.poster = img;
    pw.appendChild(v);

    v.addEventListener('playing', function(){ loader(false); });
    v.addEventListener('canplay',  function(){ loader(false); });
    v.addEventListener('pause',    function(){ loader(false); });
    v.addEventListener('waiting',  function(){ loader(true); });

    function tryPlay() {
      var p = v.play();
      if (p && p.catch) p.catch(function(){ loader(false); });
    }

    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url;
      if (auto) tryPlay(); else loader(false);
      return;
    }

    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
    s.onload = function() {
      if (window.Hls && window.Hls.isSupported()) {
        var h = new window.Hls({ enableWorker: true, lowLatencyMode: false, liveSyncDurationCount: 3, maxBufferLength: 30 });
        h.on(window.Hls.Events.ERROR, function(e, d) {
          if (!d || !d.fatal) return;
          if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR) h.startLoad();
          else if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
          else loader(false);
        });
        h.loadSource(url);
        h.attachMedia(v);
        if (auto) tryPlay(); else loader(false);
      } else {
        v.src = url;
        loader(false);
      }
    };
    s.onerror = function() { v.src = url; loader(false); };
    document.head.appendChild(s);
  }

  function init() {
    if (typeof jwplayer === 'undefined') {
      waited += 80;
      if (waited >= LIB_TIMEOUT) { fallback(); return; }
      setTimeout(init, 80);
      return;
    }

    var cfg = {
      file:                 url,
      image:                img,
      width:                '100%',
      height:               '100%',
      skin:                 { name: 'netflix' },
      autostart:            auto,
      mute:                 muted,
      stretching:           'uniform',
      preload:              'auto',
      primary:              'html5',
      hlshtml:              true,
      playbackRateControls: [0.5, 0.75, 1, 1.25, 1.5, 2],
      cast:                 {},
      logo:                 { hide: true }
    };

    if (titl) cfg.title       = titl;
    if (sub)  cfg.description = sub;

    try {
      jw = jwplayer('pc').setup(cfg);
    } catch (e) {
      fallback();
      return;
    }

    jw.on('ready', function() { if (!auto) loader(false); });
    jw.on('buffer', function() { loader(true); });
    ['play', 'pause', 'idle', 'complete', 'firstFrame', 'bufferFull'].forEach(function(ev) {
      jw.on(ev, function() { loader(false); });
    });

    jw.on('setupError', fallback);

    jw.on('error', function() {
      loader(true);
      if (retries < MAX_RETRY) {
        retries++;
        var delay = Math.min(2000 * retries, 10000);
        setTimeout(function() {
          jw.load([{ file: url, image: img }]);
          jw.play();
        }, delay);
      } else {
        fallback();
      }
    });

    jw.on('firstFrame', function() { retries = 0; });

    jw.on('fullscreen', function(e) {
      if (e && e.fullscreen) lockLandscape(); else unlockOrientation();
    });
  }

  loader(true);
  init();
})();
</script>
</body>
</html>
