function toFriendlyMessage(raw){
  raw = String(raw || '');
  if (/timeout/i.test(raw)) return 'Connection timed out. Please check your internet and try again.';
  if (/network error/i.test(raw)) return 'Network problem — please check your internet connection.';
  if (/json parse/i.test(raw)) return 'Something went wrong loading match data. Please try again shortly.';
  if (/http\s*4\d\d/i.test(raw)) return 'This stream is currently unavailable.';
  if (/http\s*5\d\d/i.test(raw)) return 'Server is temporarily unavailable. Please try again shortly.';
  if (/shaka error|unsupported/i.test(raw)) return 'This stream could not be played on your browser right now.';
  return raw;
}

  document.getElementById('eretry').style.display = retry ? 'flex' : 'none';
  errOv.classList.add('show');
}

function tryPlayUnmuted(video){
  try { video.muted = false; } catch(e){}
  var p;
  try { p = video.play(); } catch(e){ p = null; }
  if (p && typeof p.catch === 'function') {
    return p.catch(function(err){
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        try { video.muted = true; } catch(e){}
        try { video.play().catch(function(){}); } catch(e){}
      }
    });
  }
  return Promise.resolve();
}

function loadScript(src){
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('Failed to load ' + src)); };
    document.head.appendChild(s);
  });
}

function loadPxLibs(){
  if (pxLibsPromise) return pxLibsPromise;
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = PLYR_CSS;
  document.head.appendChild(link);
  pxLibsPromise = loadScript(PLYR_JS).then(function(){
    return loadScript(HLS_JS).catch(function(){ return null; });
  });
  return pxLibsPromise;
}

function fetchJSON(url){
  return new Promise(function(res, rej){
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 12000;
    x.onreadystatechange = function(){
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { res(JSON.parse(x.responseText)); }
        catch(e){ rej(new Error('JSON parse error')); }
      } else { rej(new Error('HTTP ' + x.status)); }
    };
    x.onerror = function(){ rej(new Error('Network error')); };
    x.ontimeout = function(){ rej(new Error('Timeout')); };
    x.send();
  });
}

function findMatch(data){
  var list = Array.isArray(data) ? data : (Array.isArray(data.matches) ? data.matches : []);
  if (!list.length) throw new Error('No matches in JSON');
  for (var i = 0; i < list.length; i++) {
    if (String(list[i].match_id) === String(matchId)) return list[i];
  }
  throw new Error('Match "' + matchId + '" not found (' + list.length + ' total)');
}

function pickLanguageKey(m){
  var as = m.auto_streams || {};
  var keys = Object.keys(as);
  if (!keys.length) return null;
  var want = LANG_MAP[langCode] || m.language || keys[0];
  for (var i = 0; i < keys.length; i++) if (keys[i] === want) return keys[i];
  for (var j = 0; j < keys.length; j++) if (String(keys[j]).toUpperCase() === String(want).toUpperCase()) return keys[j];
  return keys[0];
}

function resolve(data){
  var m = findMatch(data);
  var s = m.streams || {};
  var fb = [s.primary, s.fancode_cdn, s.fancode_lk_cdn, s.fancode_bd_cdn, s.fancode_np_cdn].filter(Boolean);
  if (si === 0) {
    var as = m.auto_streams || {};
    if (!Object.keys(as).length) throw new Error('No live stream — match not started yet');
    var lang = pickLanguageKey(m);
    var al = as[lang];
    if (!al || !al.streams || !Object.keys(al.streams).length) throw new Error('Stream URLs empty for this match');
    return { type:'multi', streams:al.streams, fallbacks:fb };
  }
  var u = si === 1 ? s.fancode_lk_cdn : si === 2 ? s.fancode_np_cdn : si === 3 ? s.fancode_bd_cdn : null;
  if (!u) throw new Error('Regional stream (s=' + si + ') not available');
  return { type:'single', url:u, fallbacks:fb };
}

function getPxUrl(m){
  var lang = pickLanguageKey(m);
  if (!lang) return null;
  var al = m.auto_streams[lang] || {};
  if (al.sonu_px) return al.sonu_px;
  var s = al.streams || {};
  return s['720p'] || s['540p'] || s['480p'] || s['360p'] || s['1080p'] || s['240p'] ||
         (m.streams && m.streams.fancode_cdn) || (m.streams && m.streams.primary) || null;
}

async function tryShaka(url){
  if (!shakaPlayer) {
    shakaPlayer = new shaka.Player();
    await shakaPlayer.attach(vid);
    shakaPlayer.configure({
      streaming: {
        bufferingGoal: 6,
        rebufferingGoal: 1.5,
        safeSeekOffset: 5,
        lowLatencyMode: false,
        retryParameters: { timeout: 15000, maxAttempts: 3, baseDelay: 500, backoffFactor: 1.5, fuzzFactor: 0.5 }
      },
      manifest: {
        retryParameters: { timeout: 15000, maxAttempts: 3, baseDelay: 400, backoffFactor: 1.5, fuzzFactor: 0.5 }
      }
    });
    shakaPlayer.getNetworkingEngine().registerRequestFilter(function(type, req){
      req.allowCrossSiteCredentials = true;
    });
  } else {
    try { await shakaPlayer.unload(); } catch(e){}
  }
  await shakaPlayer.load(url);
}

function armPlaybackWatchers(){
  var onP = function(){ vid.removeEventListener('playing', onP); hideOverlay(); };
  vid.addEventListener('playing', onP);
  setTimeout(function(){ if (!hasError) hideOverlay(); }, 9000);
}

function tryNativeCascade(all, lastShakaErr){
  var idx = 0;
  function attempt(){
    if (idx >= all.length || !all[idx]) {
      showErr('Playback Error', lastShakaErr || 'No playable stream found', false);
      return;
    }
    var url = all[idx++];
    var onErr = function(){
      vid.removeEventListener('error', onErr);
      attempt();
    };
    vid.addEventListener('error', onErr, {once:true});
    vid.src = url;
    tryPlayUnmuted(vid).then(syncVol);
    armPlaybackWatchers();
  }
  attempt();
}

async function loadStream(url, fallbacks){
  hasError = false;
  var all = [url].concat((fallbacks || []).filter(function(u){ return u && u !== url; }));
  var lastErr = null;

  if (shaka.Player.isBrowserSupported()) {
    for (var i = 0; i < all.length; i++) {
      if (!all[i]) continue;
      try {
        await tryShaka(all[i]);
        lastErr = null;
        break;
      } catch(e) {
        var hs = (e.data && e.data[1]) ? ' (HTTP ' + e.data[1] + ')' : '';
        lastErr = 'Shaka Error ' + (e.code || '?') + hs;
        if (shakaPlayer) { try { await shakaPlayer.destroy(); } catch(x){} shakaPlayer = null; }
      }
    }
  } else {
    lastErr = 'unsupported';
  }

  if (lastErr) {
    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      tryNativeCascade(all, lastErr);
      return;
    }
    showErr('Playback Error', lastErr, false);
    return;
  }

  tryPlayUnmuted(vid).then(syncVol);
  armPlaybackWatchers();
}

function setupPx(url){
  if (hlsInst) { try { hlsInst.destroy(); } catch(e){} hlsInst = null; }
  if (plyrInst) { try { plyrInst.destroy(); } catch(e){} plyrInst = null; }

  plyrWrap.innerHTML = '';
  plyrWrap.classList.add('on');

  pxVideo = document.createElement('video');
  pxVideo.id = 'pxVideo';
  pxVideo.setAttribute('playsinline', '');
  pxVideo.setAttribute('webkit-playsinline', '');
  pxVideo.setAttribute('crossorigin', 'anonymous');
  pxVideo.preload = 'auto';
  plyrWrap.appendChild(pxVideo);

  plyrInst = new Plyr(pxVideo, {
    controls: ['play-large','play','progress','current-time','duration','mute','volume','settings','pip','airplay','fullscreen'],
    settings: ['speed'],
    speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
    keyboard: { focused: true, global: true },
    tooltips: { controls: true, seek: true },
    fullscreen: { enabled: true, fallback: true, iosNative: true },
    hideControls: true,
    resetOnEnd: false,
    invertTime: false,
    displayDuration: true,
    seekTime: 10,
    storage: { enabled: false }
  });

  pxVideo.addEventListener('playing', function(){
    hasError = false;
    errOv.classList.remove('show');
    hideOverlay();
  });

  pxVideo.addEventListener('error', function(){
    if (!hlsInst) showErr('Playback Error', 'Stream unavailable', true);
  });

  pxRetries = 0;
  if (window.Hls && Hls.isSupported()) {
    hlsInst = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 15,
      maxBufferLength: 20,
      maxMaxBufferLength: 30,
      manifestLoadingTimeOut: 12000,
      manifestLoadingMaxRetry: 3,
      manifestLoadingRetryDelay: 500,
      levelLoadingTimeOut: 12000,
      levelLoadingMaxRetry: 3,
      fragLoadingTimeOut: 20000,
      fragLoadingMaxRetry: 4,
      startLevel: -1,
      capLevelToPlayerSize: true
    });
    hlsInst.on(Hls.Events.MANIFEST_PARSED, function(){
      tryPlayUnmuted(pxVideo);
    });
    hlsInst.on(Hls.Events.ERROR, function(evt, data){
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (pxRetries < 2) { pxRetries++; try { hlsInst.startLoad(); } catch(e){} }
        else showErr('Playback Error', 'Network error while loading stream', true);
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        if (pxRetries < 2) { pxRetries++; try { hlsInst.recoverMediaError(); } catch(e){} }
        else showErr('Playback Error', 'Media error while playing stream', true);
      } else {
        showErr('Playback Error', 'Stream error: ' + (data.details || ''), true);
      }
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(pxVideo);
  } else if (pxVideo.canPlayType('application/vnd.apple.mpegurl')) {
    pxVideo.src = url;
    pxVideo.addEventListener('loadedmetadata', function(){ tryPlayUnmuted(pxVideo); }, {once:true});
  } else {
    showErr('Unsupported Browser', 'HLS playback is not supported on this browser', false);
  }
}

function startPx(){
  clearTimeout(retryTimer);
  hasError = false;
  showLoad();
  if (!matchId) { showErr('Missing match ID', 'URL: ?id=MATCHID_px', false); return; }
  Promise.all([loadPxLibs(), fetchJSON(JSON_URL)]).then(function(r){
    var m = findMatch(r[1]);
    if (!m.auto_streams || !Object.keys(m.auto_streams).length) throw new Error('No live stream — match not started yet');
    var url = getPxUrl(m);
    if (!url) throw new Error('sonu_px stream not available for this match');
    setupPx(url);
  }).catch(function(e){
    showErr('Stream Unavailable', (e && e.message) ? e.message : 'Something went wrong', true);
    retryTimer = setTimeout(startPx, 8000);
  });
}

function start(){
  clearTimeout(retryTimer);
  showLoad();
  if (!matchId) { showErr('Missing match ID', 'URL: ?id=MATCHID_LANG&s=0', false); return; }
  fetchJSON(JSON_URL).then(function(data){
    var r;
    try { r = resolve(data); }
    catch(e){ showErr('Stream Unavailable', e.message, true); retryTimer = setTimeout(start, 8000); return; }
    if (r.type === 'multi') {
      qStreams = r.streams;
      var url = r.streams[DEFAULT_Q] || r.streams['720p'] || r.streams['480p'] || r.streams['1080p'] || r.streams['360p'] || r.streams['240p'];
      if (!url) { showErr('No stream URL', 'All quality URLs empty for this match', true); return; }
      currentQ = Q_ORDER.find(function(q){ return r.streams[q] === url; }) || DEFAULT_Q;
      qlbl.textContent = currentQ;
      bq.style.display = '';
      loadStream(url, r.fallbacks);
    } else {
      bq.style.display = 'none';
      loadStream(r.url, r.fallbacks);
    }
  }).catch(function(e){
    showErr('Could not load data', e.message, true);
    retryTimer = setTimeout(start, 8000);
  });
}

bpbtn.addEventListener('click', function(e){
  e.stopPropagation();
  uPaused = false;
  vid.play().catch(function(){});
});
vid.addEventListener('play', syncBig);
vid.addEventListener('pause', syncBig);

player.addEventListener('click', function(e){
  if (e.target.closest('#crow')) return;
  if (e.target.closest('.bpbtn')) return;
  if (qCooldown) return;
  showCtrls();
});

player.addEventListener('mousemove', showCtrls);
player.addEventListener('touchstart', showCtrls, {passive:true});

function togglePlay(){
  if (vid.paused) { uPaused = false; vid.play().catch(function(){}); }
  else { uPaused = true; vid.pause(); }
}

bplay.addEventListener('click', function(e){ e.stopPropagation(); togglePlay(); });

vid.addEventListener('play', function(){ syncPlayIcon(); showCtrls(); });
vid.addEventListener('pause', function(){ syncPlayIcon(); showCtrls(); });

vid.addEventListener('pause', function(){
  if (!vid.ended && !uPaused) {
    setTimeout(function(){ if (vid.paused && !vid.ended && !uPaused) vid.play().catch(function(){}); }, 800);
  }
});

setInterval(function(){
  if (vid.src && vid.paused && !vid.ended && !uPaused) vid.play().catch(function(){});
}, 4000);

bvol.addEventListener('click', function(e){
  e.stopPropagation();
  vid.muted = !vid.muted;
  syncVol();
});

livepill.addEventListener('click', function(){
  if (!isLive || !vid.seekable || !vid.seekable.length) return;
  var edge = vid.seekable.end(vid.seekable.length - 1);
  vid.currentTime = edge;
  uPaused = false;
  if (vid.paused) vid.play().catch(function(){});
});

setInterval(function(){
  if (!isLive) { livepill.style.display = 'none'; return; }
  if (!vid.seekable || !vid.seekable.length) return;
  var edge = vid.seekable.end(vid.seekable.length - 1);
  var behind = edge - vid.currentTime > 12;
  livepill.style.cursor = behind ? 'pointer' : 'default';
  lpitext.textContent = behind ? 'GO LIVE' : 'LIVE';
  livepill.style.color = behind ? '#ffb020' : '#ff5a5a';
  livepill.style.borderColor = behind ? 'rgba(255,176,32,.32)' : 'rgba(255,69,69,.32)';
  livepill.style.background = behind ? 'rgba(255,176,32,.13)' : 'rgba(255,69,69,.13)';
  var dot = livepill.querySelector('.ldot');
  if (dot) dot.style.background = behind ? '#ffb020' : '#ff4545';
}, 2000);

vid.addEventListener('timeupdate', function(){
  if (isDragging) return;
  var p = (vid.duration && isFinite(vid.duration)) ? vid.currentTime / vid.duration * 100 : 99.5;
  setP(p);
});

vid.addEventListener('progress', function(){
  if (!vid.buffered.length || !isFinite(vid.duration)) return;
  pbuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
});

vid.addEventListener('loadedmetadata', function(){
  isLive = !isFinite(vid.duration) || vid.duration > 86400;
  if (!isLive) livepill.style.display = 'none';
});

prog.addEventListener('mousedown',  function(e){ isDragging = true; prog.classList.add('drag'); applySeek(spct(e)); });
prog.addEventListener('touchstart', function(e){ isDragging = true; prog.classList.add('drag'); applySeek(spct(e)); }, {passive:true});
document.addEventListener('mousemove', function(e){ if (isDragging) applySeek(spct(e)); });
document.addEventListener('touchmove', function(e){ if (isDragging) { e.preventDefault(); applySeek(spct(e)); } }, {passive:false});
document.addEventListener('mouseup',  function(){ if (isDragging) { isDragging = false; prog.classList.remove('drag'); } });
document.addEventListener('touchend', function(){ if (isDragging) { isDragging = false; prog.classList.remove('drag'); } });

bq.addEventListener('click', function(e){
  e.stopPropagation();
  e.preventDefault();
  if (qCooldown) return;
  var avail = Q_ORDER.filter(function(q){ return qStreams[q]; });
  if (!avail.length) return;

  var sel = document.createElement('select');
  sel.style.cssText = 'position:fixed;opacity:0.01;top:0;left:0;width:100%;height:100%;z-index:10000;font-size:16px;background:transparent;border:none;outline:none;-webkit-appearance:none;';
  avail.forEach(function(q){
    var o = document.createElement('option');
    o.value = q;
    o.textContent = q + (q === currentQ ? ' ✓' : '');
    o.selected = (q === currentQ);
    sel.appendChild(o);
  });
  var done = false;
  function cleanup(){
    if (done) return;
    done = true;
    if (document.body.contains(sel)) document.body.removeChild(sel);
    qCooldown = true;
    setTimeout(function(){ qCooldown = false; }, 700);
  }
  sel.addEventListener('change', function(){ var v = sel.value; cleanup(); if (v && v !== currentQ) switchQ(v); });
  sel.addEventListener('blur', function(){ setTimeout(cleanup, 250); });
  document.body.appendChild(sel);
  sel.focus();
  try { if (sel.showPicker) sel.showPicker(); else sel.click(); } catch(ex){ sel.click(); }
});

applyFillMode(0);
bfill.addEventListener('click', function(e){
  e.stopPropagation();
  fillModeIdx = (fillModeIdx + 1) % FILL_MODES.length;
  applyFillMode(fillModeIdx);
});

if (!document.pictureInPictureEnabled) bpip.style.display = 'none';
bpip.addEventListener('click', function(e){
  e.stopPropagation();
  if (document.pictureInPictureElement) document.exitPictureInPicture().catch(function(){});
  else vid.requestPictureInPicture().catch(function(){});
});

bfs.addEventListener('click', function(e){
  e.stopPropagation();
  var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
  if (!inFs) {
    var req = player.requestFullscreen || player.webkitRequestFullscreen || player.mozRequestFullScreen;
    if (req) {
      var fsResult = req.call(player);
      if (fsResult && typeof fsResult.then === 'function') {
        fsResult.then(function(){
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
        }).catch(function(){
          if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen();
        });
      } else {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){});
      }
    } else if (vid.webkitEnterFullscreen) {
      vid.webkitEnterFullscreen();
    }
  } else {
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
    if (ex) {
      var exResult = ex.call(document);
      if (exResult && typeof exResult.catch === 'function') exResult.catch(function(){});
    }
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }
});

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(function(ev){
  document.addEventListener(ev, syncFs);
});

document.getElementById('retryNow').addEventListener('click', function(){
  if (pxMode) startPx(); else start();
});

shaka.polyfill.installAll();

if (pxMode) {
  initPx();
} else {
  start();
}

})();
</script>

</body>
