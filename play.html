<script>
/* Playlist shaping that works for EVERY engine (JW Player, hls.js):
   1) keeps ONE quality only: 720p, else 1080p, else the closest one
   2) revives frozen live playlists by generating the next .ts segments
   It hooks fetch + XMLHttpRequest, so JW Player's own loader gets the fixed playlist too. */
(function(){
'use strict';
var st = { on: false, safetyMs: 8000, extendOff: false, miss404: 0 };
var isSeg = /\.ts(\?|#|$)/i;

function log(m){ try { if (window.__dbg) window.__dbg(m); } catch(e){} }

function onlyOneQuality(text){
  var lines = text.split(/\r?\n/), head = [], vars = [];
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if (!l) continue;
    if (l.indexOf('#EXT-X-I-FRAME-STREAM-INF') === 0) continue;
    if (l.indexOf('#EXT-X-STREAM-INF') === 0){
      var j = i + 1;
      while (j < lines.length && !lines[j].trim()) j++;
      var uri = j < lines.length ? lines[j].trim() : '';
      if (!uri || uri.charAt(0) === '#') continue;
      var rm = l.match(/RESOLUTION=(\d+)x(\d+)/i);
      var bm = l.match(/(?:^|[:,])BANDWIDTH=(\d+)/i);
      vars.push({ inf: l, uri: uri, h: rm ? +rm[2] : 0, bw: bm ? +bm[1] : 0 });
      i = j;
    } else {
      head.push(l);
    }
  }
  if (vars.length < 2) return text;
  var withH = vars.filter(function(v){ return v.h > 0; });
  if (!withH.length) return text;
  function within(a, b){
    return withH.filter(function(v){ return v.h >= a && v.h <= b; })
      .sort(function(x, y){ return y.bw - x.bw; })[0];
  }
  var pick = within(700, 740) || within(1040, 1100) ||
    withH.slice().sort(function(a, b){ return Math.abs(a.h - 720) - Math.abs(b.h - 720); })[0];
  log('single quality: ' + pick.h + 'p (of ' + vars.length + ')');
  return head.join('\n') + '\n' + pick.inf + '\n' + pick.uri + '\n';
}

function extendStalePlaylist(text){
  if (st.extendOff || !text) return text;
  if (text.indexOf('#EXTINF:') === -1) return text;
  if (text.indexOf('#EXT-X-STREAM-INF') !== -1) return text;
  if (text.indexOf('#EXT-X-ENDLIST') !== -1) return text;
  if (text.indexOf('#EXT-X-KEY') !== -1 || text.indexOf('#EXT-X-MAP') !== -1) return text;
  var lines = text.split('\n');
  var entries = [], header = [];
  var inHeader = true, dur = '4.000', pdt = '';
  for (var i = 0; i < lines.length; i++){
    var l = lines[i].trim();
    if (!l) continue;
    if (l.indexOf('#EXTINF:') === 0){
      inHeader = false;
      var dm = l.match(/#EXTINF:([0-9.]+)/);
      if (dm) dur = dm[1];
    } else if (l.indexOf('#EXT-X-PROGRAM-DATE-TIME:') === 0){
      inHeader = false;
      pdt = l.substring(25).trim();
    } else if (l.charAt(0) === '#'){
      if (inHeader && l.indexOf('#EXT-X-MEDIA-SEQUENCE:') !== 0) header.push(l);
    } else {
      inHeader = false;
      entries.push({ dur: dur, pdt: pdt, uri: l });
      pdt = '';
    }
  }
  if (!entries.length) return text;
  var last = entries[entries.length - 1];
  if (!last.pdt) return text;
  var lastMs = Date.parse(last.pdt);
  if (!lastMs || isNaN(lastMs)) return text;
  var seg = last.uri.match(/^(.*-)(\d+)(\.ts.*)$/i);
  if (!seg) return text;
  var lastSeq = parseInt(seg[2], 10);
  var segMs = Math.max(1000, Math.round((parseFloat(last.dur) || 4) * 1000));
  var elapsed = Math.floor((Date.now() - lastMs - st.safetyMs) / segMs);
  if (elapsed <= 0 || elapsed > 10800) return text;
  var windowSize = 75;
  var sm = text.match(/#EXT-X-MEDIA-SEQUENCE:(\d+)/);
  var baseSeq = sm ? parseInt(sm[1], 10) : 0;
  var startOff = Math.max(1, elapsed - (windowSize - 1));
  var newBase = baseSeq + Math.max(0, entries.length + elapsed - windowSize);
  var finals = [];
  if (startOff === 1){
    var keep = Math.max(0, entries.length - (windowSize - elapsed));
    for (var k = keep; k < entries.length; k++) finals.push(entries[k]);
  }
  for (var n = startOff; n <= elapsed; n++){
    finals.push({ dur: last.dur, pdt: new Date(lastMs + n * segMs).toISOString(), uri: seg[1] + (lastSeq + n) + seg[3] });
  }
  var out = header.slice();
  out.push('#EXT-X-MEDIA-SEQUENCE:' + newBase);
  finals.forEach(function(f){
    out.push('#EXTINF:' + f.dur + ',');
    if (f.pdt) out.push('#EXT-X-PROGRAM-DATE-TIME:' + f.pdt);
    out.push(f.uri);
  });
  log('frozen playlist extended by ' + elapsed + ' segments');
  return out.join('\n') + '\n';
}

function shape(text){
  if (typeof text !== 'string' || text.slice(0, 16).indexOf('#EXTM3U') === -1) return text;
  if (text.indexOf('#EXT-X-STREAM-INF') !== -1) return onlyOneQuality(text);
  return extendStalePlaylist(text);
}

function note404(){
  st.miss404++;
  st.safetyMs = Math.min(60000, st.safetyMs + 8000);
  if (st.miss404 >= 5) st.extendOff = true;
}

function reset(){
  st.safetyMs = 8000;
  st.extendOff = false;
  st.miss404 = 0;
}

/* ---- fetch hook ---- */
try {
  var nFetch = window.fetch;
  if (typeof nFetch === 'function'){
    window.fetch = function(input, init){
      var url = typeof input === 'string' ? input : ((input && input.url) || '');
      var byUrl = /\.m3u8(\?|#|$)/i.test(url);
      if (st.on && byUrl && typeof input === 'string'){
        init = Object.assign({}, init || {});
        if (!init.cache) init.cache = 'no-store';
      }
      var p = nFetch.call(window, input, init);
      if (!st.on) return p;
      return p.then(function(res){
        if (!res) return res;
        if (res.status === 404 && isSeg.test(url)) note404();
        if (!res.ok) return res;
        var ct = (res.headers && res.headers.get && res.headers.get('content-type')) || '';
        if (!byUrl && !/mpegurl/i.test(ct)) return res;
        return res.clone().text().then(function(t){
          var out = shape(t);
          if (out === t) return res;
          var r = new Response(out, { status: res.status, statusText: res.statusText, headers: res.headers });
          try { Object.defineProperty(r, 'url', { value: res.url }); } catch(e){}
          return r;
        });
      });
    };
  }
} catch(e){}

/* ---- XMLHttpRequest hook (prototype level, so it also catches references the player saved early) ---- */
try {
  var XP = XMLHttpRequest.prototype;
  var dText = Object.getOwnPropertyDescriptor(XP, 'responseText');
  var dResp = Object.getOwnPropertyDescriptor(XP, 'response');
  var nOpen = XP.open;
  if (dText && dText.get && dResp && dResp.get){
    XP.open = function(method, url){
      this.__u = String(url);
      if (!this.__ls){
        this.__ls = true;
        this.addEventListener('loadend', function(){
          if (st.on && this.status === 404 && isSeg.test(this.__u || '')) note404();
        });
      }
      return nOpen.apply(this, arguments);
    };
    var textOf = function(x, raw){
      if (!st.on || x.readyState !== 4 || typeof raw !== 'string') return raw;
      if (x.__raw !== raw){ x.__raw = raw; x.__out = shape(raw); }
      return x.__out;
    };
    Object.defineProperty(XP, 'responseText', {
      configurable: true, enumerable: true,
      get: function(){ return textOf(this, dText.get.call(this)); }
    });
    Object.defineProperty(XP, 'response', {
      configurable: true, enumerable: true,
      get: function(){
        var raw = dResp.get.call(this), rt = this.responseType;
        return (rt === '' || rt === 'text') ? textOf(this, raw) : raw;
      }
    });
  }
} catch(e){}

window.PL = { st: st, shape: shape, note404: note404, reset: reset };
})();
</script>

<script>
(function(){
'use strict';

var JSON_URL = 'https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/refs/heads/main/fancode.json';
var JW_WAIT_MS = 10000;
var HLS_JS = 'https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
var IST_OFFSET_MIN = 330;
var PROXY_URL = '';
var LANG_CODES = {ENGLISH:'eng',HINDI:'hin',BANGLA:'ban',BENGALI:'ban',TAMIL:'tam',TELUGU:'tel',KANNADA:'kan',MARATHI:'mar',MALAYALAM:'mal',PUNJABI:'pan',GUJARATI:'guj',URDU:'urd',ODIA:'ori',ASSAMESE:'asm',BHOJPURI:'bho'};

var sp = new URLSearchParams(location.search);
var parts = (sp.get('id') || '').split('_').filter(Boolean);
if (parts.length > 1 && parts[parts.length - 1].toLowerCase() === 'px') parts.pop();
var matchId = parts[0] || '';
var wantCode = parts[1] || 'eng';
var si = parseInt(sp.get('s') || '0', 10) || 0;

var $ = function(id){ return document.getElementById(id); };
var stage = $('stage'), cbody = $('cbody'), poster = $('poster'), vid = $('vid');
var badge = $('badge'), unmuteBtn = $('unmute'), cta = $('cta');

var match = null;
var started = false;
var libsPromise = null;
var jw = null;
var engine = 'jw';
var jwUrls = [];
var jIdx = 0;
var jwRetry = 0;
var jwSeq = 0;
var jwGot = false;
var jwPending = false;
var fbRes = null;
var hls = null;
var attempts = [];
var aIdx = 0;
var levels = [];
var lastErr = '';
var DEBUG = sp.get('debug') === '1';
var endedReloads = 0;
var badgeState = 'live';
var qLabel = '';
var netRetry = 0;
var mediaRetry = 0;
var watchdog = 0;
var pollTimer = 0;
var tickTimer = 0;
var copiedTimer = 0;

function dbg(msg){
  if (!DEBUG) return;
  var el = document.getElementById('dbg');
  if (!el){
    el = document.createElement('div');
    el.id = 'dbg';
    el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:100px;z-index:60;font:11px/1.35 monospace;background:rgba(0,0,0,.78);color:#9f9;padding:6px 8px;max-height:150px;overflow:auto;white-space:pre-wrap;pointer-events:none;border-radius:8px';
    document.body.appendChild(el);
  }
  el.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}

window.__dbg = dbg;

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

function langCode(raw){
  var l = String(raw || '').trim().toUpperCase();
  if (!l || l === 'BLOODY_SWEET') return 'eng';
  return LANG_CODES[l] || l.slice(0, 3).toLowerCase();
}

function capital(s){
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}

function toIstMs(y, mo, d, h, mi, s, ap){
  h = +h;
  if (ap){
    ap = ap.toUpperCase();
    if (ap === 'PM' && h < 12) h += 12;
    if (ap === 'AM' && h === 12) h = 0;
  }
  return Date.UTC(+y, +mo - 1, +d, h, +mi, s ? +s : 0) - IST_OFFSET_MIN * 60000;
}

function parseIST(str){
  if (!str) return null;
  var s = String(str).trim();
  var m = s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)\s+(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/i);
  if (m) return toIstMs(m[7], m[6], m[5], m[1], m[2], m[3], m[4]);
  var t = Date.parse(s);
  return isNaN(t) ? null : t;
}

function pad(n){ return String(n).padStart(2, '0'); }

function fmtCountdown(ms){
  var s = Math.max(0, Math.floor(ms / 1000));
  var d = Math.floor(s / 86400);
  var h = Math.floor(s % 86400 / 3600);
  var m = Math.floor(s % 3600 / 60);
  var out = pad(h) + 'h : ' + pad(m) + 'm : ' + pad(s % 60) + 's';
  return d ? d + 'd : ' + out : out;
}

function setState(state){
  stage.dataset.state = state;
  if (state !== 'play') $('buffer').classList.remove('on');
}

function showCover(html){
  cbody.innerHTML = html;
}

function showLoading(){
  setState('load');
  showCover('<div class="ring"></div>');
}

function showError(title, msg, opts){
  opts = opts || {};
  clearInterval(tickTimer);
  setState('error');
  showCover('<div class="ebox"><div class="et">' + esc(title) + '</div><div class="cm">' + esc(msg) + '</div>' +
    (opts.detail ? '<div class="dt">' + esc(opts.detail) + '</div>' : '') +
    '<button class="rt" id="retry" type="button">Try again</button>' +
    (opts.link ? '<a class="sec-btn" href="' + esc(opts.link) + '" target="_blank" rel="noopener noreferrer">Open stream link</a>' : '') +
    '</div>');
  $('retry').addEventListener('click', function(){ showLoading(); load(); });
  schedulePoll(10000);
}

function coverTitle(){
  if (!match) return '';
  var tm = match.teams.length === 2 ? esc(match.teams[0]) + ' <span>vs</span> ' + esc(match.teams[1]) : esc(match.teams[0]);
  return '<div class="ct">' + tm + '</div>' + (match.tournament ? '<div class="cs">' + esc(match.tournament) + '</div>' : '');
}

function showWaiting(){
  setState('wait');
  clearInterval(tickTimer);
  var start = match && match.startMs;
  if (match && match.status !== 'LIVE' && start && start > Date.now()){
    showCover(coverTitle() + '<div class="cl">Watch live in</div><div class="cd" id="cd">' + fmtCountdown(start - Date.now()) + '</div>');
    tickTimer = setInterval(function(){
      var left = start - Date.now();
      if (left <= 0){ clearInterval(tickTimer); load(); return; }
      var el = $('cd');
      if (el) el.textContent = fmtCountdown(left);
    }, 1000);
    return;
  }
  var passed = match && match.status !== 'LIVE' && start;
  showCover(coverTitle() + '<div class="cl">' + (passed || (match && match.status === 'LIVE') ? 'Broadcasting soon' : 'Starting soon') +
    '</div><div class="cm">The stream will start automatically. Please keep this page open.</div>');
}

function resolve(m){
  var s = m.streams || {};
  var groups = m.auto_streams && typeof m.auto_streams === 'object' ? m.auto_streams : {};
  var keys = Object.keys(groups).filter(function(k){ return groups[k] && groups[k].streams && Object.keys(groups[k].streams).length; });
  var urls = [];
  if (si !== 0){
    urls.push(si === 1 ? s.fancode_lk_cdn : si === 2 ? s.fancode_np_cdn : si === 3 ? s.fancode_bd_cdn : null);
  } else {
    var key = keys.filter(function(k){ return langCode(k) === wantCode; })[0] || keys[0];
    var qualityUrls = [];
    if (key){
      var st = groups[key].streams;
      var cand = Object.keys(st).map(function(k){
        var mm = k.match(/^(\d+)p$/i);
        return { h: mm ? +mm[1] : 0, u: st[k] };
      }).filter(function(x){ return x.h && x.u; });
      // only 720p, then 1080p. If neither exists keep the single closest one.
      var pref = cand.filter(function(x){ return x.h === 720; }).concat(cand.filter(function(x){ return x.h === 1080; }));
      if (!pref.length && cand.length){
        cand.sort(function(a, b){ return Math.abs(a.h - 720) - Math.abs(b.h - 720); });
        pref = [cand[0]];
      }
      qualityUrls = pref.map(function(x){ return x.u; });
    }
    urls = qualityUrls.concat([s.fancode_cdn, s.primary]);
  }
  urls = urls.concat([s.fancode_lk_cdn, s.fancode_bd_cdn, s.fancode_np_cdn]);
  urls = urls.filter(function(u, i){ return u && urls.indexOf(u) === i; });
  return urls.length ? { urls: urls } : null;
}

function makeLoader(mode){
  function Loader(){ this.aborted = false; this.ctrl = null; }
  Loader.prototype.destroy = Loader.prototype.abort = function(){
    this.aborted = true;
    if (this.ctrl){ try { this.ctrl.abort(); } catch(e){} }
  };
  Loader.prototype.load = function(ctx, cfg, cb){
    var self = this;
    var t0 = performance.now();
    self.context = ctx;
    self.ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function(){ if (self.ctrl) self.ctrl.abort(); }, 12000);
    var target = mode === 'proxy' && PROXY_URL ? PROXY_URL + encodeURIComponent(ctx.url) : ctx.url;
    fetch(target, { cache: 'no-store', signal: self.ctrl ? self.ctrl.signal : undefined })
      .then(function(res){
        if (self.aborted) return;
        if (!res.ok){ cb.onError({ code: res.status, text: 'HTTP ' + res.status }, ctx, res, {}); return; }
        return res.text().then(function(data){
          if (self.aborted) return;
          var out = PL.shape(data);
          var now = performance.now();
          var stats = {
            aborted: false, loaded: out.length, total: out.length, retry: 0, chunkCount: 0, bwEstimate: 0,
            trequest: t0, tfirst: now, tload: now,
            loading: { start: t0, first: now, end: now },
            parsing: { start: 0, end: 0 },
            buffering: { start: 0, end: 0 }
          };
          self.stats = stats;
          cb.onSuccess({ url: ctx.url, data: out }, stats, ctx, res);
        });
      })
      .catch(function(e){
        if (!self.aborted) cb.onError({ code: 0, text: (e && e.message) || 'Network error' }, ctx, null, {});
      })
      .then(function(){ clearTimeout(timer); });
  };
  return Loader;
}

function refreshBadge(){
  var txt = badgeState === 'buffering' ? 'Buffering' : badgeState === 'reconnecting' ? 'Reconnecting' : 'LIVE' + (qLabel ? ' · ' + qLabel : '');
  $('btxt').textContent = txt;
}

function inFs(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
}

function lockLandscape(){
  if (!screen.orientation || typeof screen.orientation.lock !== 'function') return;
  var attempt = function(){ screen.orientation.lock('landscape').catch(function(){}); };
  if (inFs()) attempt(); else setTimeout(attempt, 120);
}

function unlockOrientation(){
  try { if (screen.orientation && typeof screen.orientation.unlock === 'function') screen.orientation.unlock(); } catch(e){}
}

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(ev){
  document.addEventListener(ev, function(){ if (inFs()) lockLandscape(); else unlockOrientation(); });
});

if (screen.orientation && screen.orientation.addEventListener){
  screen.orientation.addEventListener('change', function(){
    if (inFs() && screen.orientation.type && screen.orientation.type.indexOf('portrait') === 0) lockLandscape();
  });
}

window.addEventListener('pagehide', function(){
  try { destroyJw(); } catch(e){}
  destroyHls();
});

function loadScript(src){
  return new Promise(function(res, rej){
    var el = document.createElement('script');
    el.src = src;
    el.async = true;
    el.onload = function(){ res(); };
    el.onerror = function(){ rej(new Error('Failed to load ' + src)); };
    document.head.appendChild(el);
  });
}

function loadLibs(){
  if (window.Hls) return Promise.resolve();
  if (!libsPromise) libsPromise = loadScript(HLS_JS).catch(function(){ return null; });
  return libsPromise;
}

function destroyHls(){
  if (hls){ try { hls.destroy(); } catch(e){} hls = null; }
}

/* iPhone / iPad / Safari play HLS natively, where no script can fix the playlist.
   There we use the hls.js engine (it can), everywhere else JW Player. */
function isApple(){
  var ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
    (/Safari/.test(ua) && !/Chrome|Chromium|Android|CriOS|FxiOS|Edg/.test(ua));
}

function availableModes(){
  var hlsOk = Boolean(window.Hls && window.Hls.isSupported());
  var nativeOk = Boolean(vid.canPlayType('application/vnd.apple.mpegurl'));
  var order = ['hls', 'hlsraw', 'native'];
  var out = order.filter(function(m){ return m === 'native' ? nativeOk : hlsOk; });
  if (PROXY_URL && hlsOk) out.push('proxy');
  return out;
}

function setLevel(q){
  if (!hls) return;
  if (!q){ hls.nextLevel = -1; return; }
  var best = -1, diff = Infinity;
  hls.levels.forEach(function(l, i){
    var d = Math.abs((l.height || 0) - q);
    if (d < diff){ diff = d; best = i; }
  });
  if (best >= 0) hls.nextLevel = best;
}

function ensurePlayer(){
  vid.controls = true;
}

function tryPlay(){
  var p = vid.play();
  if (p && p.catch) p.catch(function(){
    vid.muted = true;
    var q = vid.play();
    if (q && q.catch) q.catch(function(){});
  });
}

function attach(){
  var a = attempts[aIdx];
  clearTimeout(watchdog);
  destroyHls();
  netRetry = 0;
  mediaRetry = 0;
  vid.removeAttribute('src');
  try { vid.load(); } catch(e){}
  watchdog = setTimeout(function(){ lastErr = 'No data received · ' + a.mode; failover(); }, 18000);
  if (a.mode === 'native'){
    vid.src = a.url;
    ensurePlayer();
    tryPlay();
    return;
  }
  var cfg = {
    enableWorker: true,
    lowLatencyMode: false,
    maxBufferLength: 30,
    maxBufferHole: 1,
    backBufferLength: 30,
    liveSyncDurationCount: 3,
    liveMaxLatencyDurationCount: 9,
    nudgeMaxRetry: 8,
    abrEwmaDefaultEstimate: 4000000,
    manifestLoadingMaxRetry: 2,
    levelLoadingMaxRetry: 6,
    levelLoadingRetryDelay: 1000,
    fragLoadingMaxRetry: 6,
    xhrSetup: function(xhr, url){
      if (a.mode === 'proxy') xhr.open('GET', PROXY_URL + encodeURIComponent(url), true);
    }
  };
  if (a.mode !== 'hlsraw') cfg.pLoader = makeLoader(a.mode);
  dbg('attempt ' + (aIdx + 1) + '/' + attempts.length + ' ' + a.mode + ' ' + a.url);
  hls = new window.Hls(cfg);
  hls.on(window.Hls.Events.MANIFEST_PARSED, function(e, d){
    levels = (d && d.levels) || [];
    dbg('manifest ok, levels: ' + levels.length);
    ensurePlayer();
    tryPlay();
  });
  hls.on(window.Hls.Events.FRAG_LOADED, function(){ netRetry = 0; mediaRetry = 0; });
  hls.on(window.Hls.Events.LEVEL_SWITCHED, function(e, d){
    var l = hls && hls.levels[d.level];
    if (l && l.height){ qLabel = (hls.autoLevelEnabled ? 'Auto · ' : '') + l.height + 'p'; refreshBadge(); }
  });
  hls.on(window.Hls.Events.ERROR, function(e, d){
    if (!d) return;
    var code = d.response ? d.response.code : '';
    dbg((d.fatal ? 'FATAL ' : '') + d.type + '/' + d.details + (code !== '' ? ' HTTP ' + code : ''));
    if (d.details === 'fragLoadError' && code === 404){
      PL.note404();
    }
    if (!d.fatal) return;
    lastErr = d.details + (code !== '' ? ' · HTTP ' + code : '') + ' · ' + a.mode;
    var blocked = d.type === window.Hls.ErrorTypes.NETWORK_ERROR && /manifest/i.test(d.details) && !code;
    if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR && !blocked && netRetry++ < 4) hls.startLoad();
    else if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR && mediaRetry++ < 3) hls.recoverMediaError();
    else failover();
  });
  hls.loadSource(a.url);
  hls.attachMedia(vid);
}

var lastT = -1;
var stuck = 0;

function jwVideo(){
  try { return jw && jw.getContainer ? jw.getContainer().querySelector('video') : null; } catch(e){ return null; }
}

function nudge(){
  if (engine === 'jw'){
    try { if (jw) jw.play(); } catch(e){}
    return;
  }
  if (hls){
    try { hls.startLoad(-1); hls.recoverMediaError(); } catch(e){}
    var pos = hls.liveSyncPosition;
    if (pos && isFinite(pos)) vid.currentTime = pos;
  }
  tryPlay();
}

setInterval(function(){
  if (!started || stage.dataset.state !== 'play'){ stuck = 0; return; }
  var v = engine === 'jw' ? jwVideo() : vid;
  if (!v || v.paused || v.seeking){ stuck = 0; return; }
  var t = v.currentTime;
  if (Math.abs(t - lastT) > 0.1){ lastT = t; stuck = 0; return; }
  stuck++;
  if (stuck === 5){ dbg('stalled 5s: nudge'); badgeState = 'reconnecting'; refreshBadge(); nudge(); }
  else if (stuck === 11){ dbg('stalled 11s: reload source'); if (engine === 'jw') jwAttach(); else attach(); }
  else if (stuck >= 20){ dbg('stalled 20s: next source'); stuck = 0; if (engine === 'jw') jwFail('stalled'); else failover(); }
}, 1000);

function failover(){
  clearTimeout(watchdog);
  aIdx++;
  if (aIdx < attempts.length){ attach(); return; }
  destroyHls();
  started = false;
  showError('Stream unavailable', 'We couldn’t load the stream right now. Retrying automatically.', {
    detail: lastErr || 'No response from the stream server',
    link: attempts[0] && attempts[0].url
  });
}

function waitForJw(){
  return new Promise(function(resolve){
    var waited = 0;
    (function poll(){
      if (typeof window.jwplayer === 'function') return resolve(true);
      waited += 80;
      if (waited >= JW_WAIT_MS) return resolve(false);
      setTimeout(poll, 80);
    })();
  });
}

function destroyJw(){
  clearTimeout(watchdog);
  jwSeq++;
  if (jw){ try { jw.remove(); } catch(e){} jw = null; }
  $('jwbox').innerHTML = '';
}

function jwPlaying(){
  clearTimeout(watchdog);
  jwGot = true;
  jwRetry = 0;
  badgeState = 'live';
  refreshBadge();
  $('buffer').classList.remove('on');
  setState('play');
  badge.classList.toggle('on', Boolean(match && match.status === 'LIVE') || started);
  unmuteBtn.classList.toggle('on', Boolean(jw && jw.getMute && jw.getMute()));
  cta.textContent = 'Watch now';
}

function jwFail(reason){
  if (jwPending) return;
  jwPending = true;
  clearTimeout(watchdog);
  lastErr = reason + ' · jw';
  dbg('jw fail: ' + reason);
  if (jwRetry++ < 1){
    setTimeout(function(){ if (engine === 'jw' && started) jwAttach(); }, 1500);
    return;
  }
  jwRetry = 0;
  jIdx++;
  if (jIdx < jwUrls.length){ jwAttach(); return; }
  startFallback();
}

function jwAttach(){
  destroyJw();
  jwPending = false;
  jwGot = false;
  var url = jwUrls[jIdx];
  var seq = jwSeq;
  var box = document.createElement('div');
  box.id = 'jwp' + seq;
  $('jwbox').appendChild(box);
  dbg('jw attempt ' + (jIdx + 1) + '/' + jwUrls.length + ' ' + url);

  var cfg = {
    file: url,
    type: 'hls',
    width: '100%',
    height: '100%',
    skin: { name: 'netflix' },
    autostart: true,
    mute: false,
    stretching: 'uniform',
    preload: 'auto',
    primary: 'html5',
    hlshtml: true,
    cast: {},
    logo: { hide: true }
  };

  var me;
  try {
    me = window.jwplayer(box.id).setup(cfg);
  } catch(e){
    lastErr = 'jw setup · ' + (e && e.message || '');
    startFallback();
    return;
  }
  jw = me;
  function live(){ return jw === me && seq === jwSeq; }

  me.on('firstFrame', function(){ if (live()) jwPlaying(); });
  me.on('time', function(){ if (live() && !jwGot) jwPlaying(); });
  me.on('buffer', function(){
    if (!live() || stage.dataset.state !== 'play') return;
    badgeState = 'buffering';
    refreshBadge();
    $('buffer').classList.add('on');
  });
  me.on('play', function(){
    if (!live()) return;
    $('buffer').classList.remove('on');
    if (jwGot){ badgeState = 'live'; refreshBadge(); }
  });
  ['pause', 'bufferFull', 'idle'].forEach(function(ev){
    me.on(ev, function(){ if (live()) $('buffer').classList.remove('on'); });
  });
  me.on('autostartNotAllowed', function(){
    if (!live()) return;
    me.setMute(true);
    me.play();
  });
  me.on('playAttemptFailed', function(){
    if (!live()) return;
    setState('play');
    badge.classList.toggle('on', Boolean(match && match.status === 'LIVE') || started);
  });
  me.on('mute', function(e){
    if (live() && e && !e.mute) unmuteBtn.classList.remove('on');
  });
  me.on('visualQuality', function(e){
    if (!live() || !e || !e.level) return;
    var h = e.level.height ? e.level.height + 'p' : (e.level.label || '');
    if (!h || /^auto$/i.test(h)) return;
    qLabel = (e.mode === 'auto' ? 'Auto · ' : '') + h;
    refreshBadge();
  });
  me.on('fullscreen', function(e){
    if (e && e.fullscreen) lockLandscape(); else unlockOrientation();
  });
  me.on('complete', function(){
    if (live() && started && endedReloads++ < 5) jwAttach();
  });
  me.on('error', function(e){
    if (live()) jwFail('error ' + ((e && e.code) || '') + ' ' + ((e && e.message) || ''));
  });
  me.on('setupError', function(e){
    if (!live()) return;
    lastErr = 'jw setup · ' + ((e && e.message) || '');
    startFallback();
  });

  watchdog = setTimeout(function(){
    if (live() && !jwGot) jwFail('No data received');
  }, 18000);
}

function startJw(){
  PL.st.on = true;
  engine = 'jw';
  stage.classList.remove('fb');
  jwUrls = fbRes.urls.slice(0, 4);
  jIdx = 0;
  jwRetry = 0;
  lastErr = '';
  jwAttach();
}

function startFallback(){
  destroyJw();
  PL.st.on = false;
  engine = 'fb';
  stage.classList.add('fb');
  loadLibs().then(function(){
    var modes = availableModes();
    if (!modes.length){
      started = false;
      showError('Can’t play this stream', 'This browser does not support live streaming. Please try another browser.', { link: fbRes.urls[0] });
      return;
    }
    attempts = [];
    fbRes.urls.slice(0, 4).forEach(function(u){
      modes.forEach(function(m){ attempts.push({ url: u, mode: m }); });
    });
    aIdx = 0;
    attach();
  });
}

function startPlayer(res){
  showLoading();
  PL.reset();
  fbRes = res;
  destroyHls();
  vid.removeAttribute('src');
  try { vid.load(); } catch(e){}
  if (isApple()){ startFallback(); return; }
  waitForJw().then(function(ok){
    if (ok) startJw(); else startFallback();
  });
}

function paintInfo(){
  var m = match;
  var teams = m.teams;
  document.title = teams.join(' vs ') + ' - Live Stream | FC - CRICKET NEWS POINT';
  $('title').innerHTML = teams.length === 2
    ? esc(teams[0]) + ' <span class="vs">vs</span> ' + esc(teams[1])
    : esc(teams[0]);
  var status = m.status === 'LIVE' ? 'Live now' : (m.status === 'COMPLETED' ? 'Ended' : 'Upcoming');
  $('crumb').innerHTML = (m.tournament ? '<span class="tr">' + esc(m.tournament) + '</span> &bull; ' : '') + esc(status);
  var about = m.tournament
    ? 'In the ' + m.tournament + ', ' + (teams.length === 2 ? teams[0] + ' faces off against ' + teams[1] : teams[0]) + ' in what’s expected to be a thrilling contest.'
    : (teams.length === 2 ? teams[0] + ' faces off against ' + teams[1] + ' in what’s expected to be a thrilling contest.' : teams[0]);
  $('about').textContent = about;
  var when = m.startMs
    ? new Date(m.startMs).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : (m.status === 'LIVE' ? 'Live now' : 'To be announced');
  var icoTrophy = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>';
  var icoClock = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  var icoMic = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  var rows = '';
  if (m.tournament) rows += row(icoTrophy, 'Tournament', m.tournament, true);
  rows += row(icoClock, 'Match time', when, false);
  if (m.langs.length) rows += row(icoMic, 'Broadcast', m.langs.map(capital).join(', '), false);
  $('rows').innerHTML = rows;
  if (m.image){
    poster.hidden = false;
    if (poster.getAttribute('src') !== m.image) poster.src = m.image;
    poster.onerror = function(){ poster.hidden = true; };
  }
  paintLangs();
}

function row(icon, label, value, link){
  return '<div class="row"><div class="ico">' + icon + '</div><div><div class="rl">' + esc(label) +
    '</div><div class="rv' + (link ? ' lk' : '') + '">' + esc(value) + '</div></div></div>';
}

function paintLangs(){
  var m = match;
  if (m.langs.length < 2 || si !== 0){ $('langs').innerHTML = ''; return; }
  var current = m.langs.filter(function(k){ return langCode(k) === wantCode; })[0] || m.langs[0];
  $('langs').innerHTML = m.langs.map(function(k){
    return '<a class="chip' + (k === current ? ' on' : '') + '" href="?id=' + encodeURIComponent(m.id + '_' + langCode(k)) + '&s=0" replace>' + esc(capital(k)) + '</a>';
  }).join('');
}

function normalize(m){
  var title = String(m.title || 'Match');
  var p = title.split(/\s+vs\.?\s+/i);
  var groups = m.auto_streams && typeof m.auto_streams === 'object' ? m.auto_streams : {};
  return {
    id: String(m.match_id || ''),
    title: title,
    teams: p.length === 2 ? p.map(function(x){ return x.trim(); }) : [title],
    tournament: m.tournament || '',
    image: m.image || '',
    status: String(m.status || '').toUpperCase(),
    startMs: parseIST(m.startTime),
    langs: Object.keys(groups).filter(function(k){ return groups[k] && groups[k].streams && Object.keys(groups[k].streams).length; })
  };
}

function schedulePoll(ms){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(load, ms);
}

function load(){
  fetch(JSON_URL + '?_=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('bad response'); return r.json(); })
    .then(function(data){
      var list = Array.isArray(data) ? data : (Array.isArray(data.matches) ? data.matches : []);
      var raw = list.filter(function(x){ return String(x.match_id) === matchId; })[0];
      if (!raw){
        showError('Match not found', 'This match is no longer available. Go back and pick another one.');
        return;
      }
      match = normalize(raw);
      paintInfo();
      cta.textContent = 'Copy link';
      if (!started){
        var res = resolve(raw);
        var future = match.status !== 'LIVE' && match.startMs && match.startMs > Date.now();
        if (res && !future){
          started = true;
          clearInterval(tickTimer);
          startPlayer(res);
        } else {
          showWaiting();
          var left = match.startMs ? match.startMs - Date.now() : Infinity;
          schedulePoll(left < 180000 ? 8000 : 30000);
        }
      } else {
        schedulePoll(60000);
      }
    })
    .catch(function(){
      if (!started) showError('Couldn’t load match', 'Please check your internet connection.');
      else schedulePoll(60000);
    });
}

function copy(text){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function(res, rej){
    try {
      var a = document.createElement('textarea');
      a.value = text;
      a.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(a);
      a.select();
      var ok = document.execCommand('copy');
      a.remove();
      ok ? res() : rej();
    } catch(e){ rej(e); }
  });
}

function flashCta(text){
  cta.textContent = text;
  clearTimeout(copiedTimer);
  copiedTimer = setTimeout(function(){ cta.textContent = stage.dataset.state === 'play' ? 'Watch now' : 'Copy link'; }, 2000);
}

cta.addEventListener('click', function(){
  if (stage.dataset.state === 'play'){
    stage.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (engine === 'jw' && jw){ try { jw.play(); } catch(e){} return; }
    var p = vid.play();
    if (p && p.catch) p.catch(function(){});
    return;
  }
  copy(location.href).then(function(){ flashCta('Link copied'); }).catch(function(){ flashCta('Copy failed'); });
});

$('share').addEventListener('click', function(){
  var data = { title: document.title, url: location.href };
  if (navigator.share){ navigator.share(data).catch(function(){}); return; }
  copy(location.href).then(function(){ flashCta('Link copied'); }).catch(function(){});
});

$('back').addEventListener('click', function(e){
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1){
      e.preventDefault();
      history.back();
    }
  } catch(err){}
});

$('theme').addEventListener('click', function(){
  var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('fc_theme', next); } catch(e){}
  document.querySelector('meta[name="theme-color"]').content = next === 'light' ? '#f6f0e4' : '#0e1118';
});

unmuteBtn.addEventListener('click', function(){
  if (engine === 'jw' && jw){
    try { jw.setMute(false); if (jw.getVolume() === 0) jw.setVolume(100); } catch(e){}
  } else {
    vid.muted = false;
    if (vid.volume === 0) vid.volume = 1;
  }
  unmuteBtn.classList.remove('on');
});

vid.addEventListener('waiting', function(){
  if (stage.dataset.state === 'play'){ badgeState = 'buffering'; refreshBadge(); $('buffer').classList.add('on'); }
});
vid.addEventListener('playing', function(){
  clearTimeout(watchdog);
  badgeState = 'live';
  refreshBadge();
  $('buffer').classList.remove('on');
  setState('play');
  badge.classList.toggle('on', Boolean(match && match.status === 'LIVE') || started);
  unmuteBtn.classList.toggle('on', vid.muted);
  cta.textContent = 'Watch now';
});
vid.addEventListener('ended', function(){
  dbg('ended');
  if (started && endedReloads++ < 5) attach();
});
if (DEBUG){
  ['waiting', 'stalled', 'playing', 'pause'].forEach(function(ev){
    vid.addEventListener(ev, function(){ dbg('video ' + ev + ' t=' + vid.currentTime.toFixed(1)); });
  });
}
vid.addEventListener('canplay', function(){ $('buffer').classList.remove('on'); });
vid.addEventListener('pause', function(){ $('buffer').classList.remove('on'); });
vid.addEventListener('volumechange', function(){
  if (!vid.muted) unmuteBtn.classList.remove('on');
});
vid.addEventListener('error', function(){
  if (!started || hls || engine !== 'fb') return;
  lastErr = 'native · media error ' + (vid.error ? vid.error.code : '');
  failover();
});

if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
}

if (!matchId){
  showError('No match selected', 'Go back and choose a match to watch.');
} else {
  load();
}
})();
</script>
</body>
</html>
