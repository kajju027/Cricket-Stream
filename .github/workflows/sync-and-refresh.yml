name: Sync Live Meta + Title Refresh (every 12 hours)

on:
  schedule:
    - cron: '30 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-and-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update every page together, in one pass
        run: node scripts/sync-and-refresh.mjs

      - name: Commit + push only if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No files changed this run — skipping commit."
          else
            git commit -m "chore: sync live channel meta + title refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
