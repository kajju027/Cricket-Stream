name: Sync Live Meta + Title Refresh

on:
  schedule:
    - cron: '30 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-and-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update pages
        run: node scripts/sync-and-refresh.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: sync live channel meta + title refresh"
            git push
          fi
          
