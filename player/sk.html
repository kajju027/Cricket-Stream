<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0e" />
    <title>Video Player</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151519'/%3E%3Cpath d='M12 9v14l11-7-11-7Z' fill='%23e6e6ee'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.3.2/dist/controls.css" />
    <style>
      :root {
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #0b0b0e;
        color: #e8e8ee;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 18px 6px;
      }

      header[hidden] {
        display: none;
      }

      #name {
        min-width: 0;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #host {
        margin-left: auto;
        color: #8b8b97;
        font-size: 12px;
        white-space: nowrap;
      }

      main {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px 20px;
      }

      .player {
        width: 100%;
        max-width: 1150px;
      }

      .player[hidden] {
        display: none;
      }

      #container {
        position: relative;
        width: 100%;
        height: calc(100vh - 110px);
        height: calc(100dvh - 110px);
        max-height: 720px;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
      }

      #container video {
        width: 100%;
        height: 100%;
      }

      .error {
        margin: 10px 2px 0;
        color: #ffc9d2;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .error[hidden] {
        display: none;
      }

      .empty {
        max-width: 440px;
        text-align: center;
        color: #9a9aa6;
        font-size: 14px;
      }

      .empty[hidden] {
        display: none;
      }

      .empty h1 {
        margin: 0 0 8px;
        color: #ececf2;
        font-size: 18px;
      }

      .empty p {
        margin: 0;
      }

      code {
        padding: 1px 5px;
        border-radius: 4px;
        background: #1c1c23;
        color: #e6e6ee;
        font-size: 0.92em;
      }

      @media (max-width: 600px) {
        header {
          padding: 10px 12px 4px;
        }

        #host {
          display: none;
        }

        main {
          padding: 0 0 8px;
        }

        #container {
          height: calc(100vh - 58px);
          height: calc(100dvh - 58px);
          max-height: none;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header id="bar" hidden>
      <span id="name"></span>
      <span id="host"></span>
    </header>

    <main>
      <div class="player" id="player" hidden>
        <div id="container">
          <video id="video" playsinline preload="metadata"></video>
        </div>
        <p class="error" id="error" hidden></p>
      </div>

      <div class="empty" id="empty">
        <h1 id="emptyTitle">Add a video link</h1>
        <p id="emptyText">
          Append <code>?url=</code> with an HLS playlist (<code>.m3u8</code>) or a direct video file.
        </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.3.2/dist/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@5.3.2/dist/shaka-player.ui.js"></script>
    <script>
      (function () {
        "use strict";

        var params = new URLSearchParams(window.location.search);
        var raw = (params.get("url") || "").trim();
        var playerBox = document.getElementById("player");
        var container = document.getElementById("container");
        var video = document.getElementById("video");
        var bar = document.getElementById("bar");
        var name = document.getElementById("name");
        var host = document.getElementById("host");
        var empty = document.getElementById("empty");
        var emptyTitle = document.getElementById("emptyTitle");
        var emptyText = document.getElementById("emptyText");
        var error = document.getElementById("error");

        function toUrl(value) {
          if (!value) return null;
          var candidate = String(value).trim();
          if (!candidate) return null;
          if (!/^[a-z][a-z0-9+.-]*:/i.test(candidate)) candidate = "https://" + candidate;
          try {
            var url = new URL(candidate);
            if (url.protocol !== "http:" && url.protocol !== "https:") return null;
            if (!url.hostname) return null;
            return url;
          } catch (exception) {
            return null;
          }
        }

        function showEmpty(title, text) {
          emptyTitle.textContent = title;
          emptyText.textContent = text;
          empty.hidden = false;
          playerBox.hidden = true;
          bar.hidden = true;
        }

        function showError(message) {
          if (!error.hidden) return;
          error.textContent = message;
          error.hidden = false;
        }

        function titleFrom(url) {
          var parts = url.pathname.split("/").filter(Boolean);
          var last = parts.length ? parts[parts.length - 1] : "";
          try {
            last = decodeURIComponent(last);
          } catch (exception) {}
          var cleaned = last
            .replace(/\.[a-z0-9]{2,5}$/i, "")
            .replace(/[._-]+/g, " ")
            .trim();
          return cleaned || url.hostname;
        }

        function errorMessage(failure) {
          var code = failure && failure.code;
          var data = (failure && failure.data) || [];
          if (code === 1001) {
            var status = data[1];
            if (status === 404) return "The stream was not found (404). Check the link.";
            if (status === 401 || status === 403) return "The stream host denied access (" + status + ").";
            return "The host returned HTTP " + status + ".";
          }
          if (code === 1002 || code === 1003 || code === 1006) {
            return "The stream could not be loaded. The host may block cross-origin playback (CORS) or the link may be offline.";
          }
          if (code >= 4000 && code < 5000) return "This playlist could not be parsed or is not supported.";
          if (code >= 2000 && code < 3000) return "This video format is not supported by the browser.";
          return "Playback failed" + (code ? " (error " + code + ")" : "") + ".";
        }

        function startPlayback() {
          var attempt = video.play();
          if (attempt && typeof attempt.catch === "function") attempt.catch(function () {});
        }

        var source = toUrl(raw);

        if (!source) {
          if (raw) {
            showEmpty("Invalid link", "The ?url= value must be a valid http or https address.");
          }
          return;
        }

        var label = (params.get("title") || "").trim() || titleFrom(source);
        var poster = toUrl(params.get("poster") || "");
        var isStream = /\.(m3u8|mpd)$/i.test(source.pathname) || /(^|[?&])format=(hls|dash)(&|$)/i.test(source.search);

        document.title = label;
        name.textContent = label;
        host.textContent = source.hostname;
        bar.hidden = false;
        playerBox.hidden = false;
        empty.hidden = true;

        if (poster) video.poster = poster.href;

        if (!isStream) {
          video.controls = true;
          video.src = source.href;
          startPlayback();
          video.addEventListener("error", function () {
            if (!video.error || video.error.code === 1) return;
            showError(
              "This video could not be played. The link may be offline, blocked by CORS, or in an unsupported format.",
            );
          });
          return;
        }

        if (!window.shaka || !window.shaka.ui) {
          showError("Shaka Player could not be loaded from the CDN. Check your internet connection.");
          return;
        }

        window.shaka.polyfill.installAll();

        if (!window.shaka.Player.isBrowserSupported()) {
          showError("This browser does not support Shaka Player.");
          return;
        }

        var player = new window.shaka.Player();
        var ui;

        player.addEventListener("error", function (event) {
          showError(errorMessage(event.detail));
        });

        player
          .attach(video)
          .then(function () {
            ui = new window.shaka.ui.Overlay(player, container, video);
            ui.configure({});
            return player.load(source.href);
          })
          .then(startPlayback)
          .catch(function (failure) {
            showError(errorMessage(failure));
          });
      })();
    </script>
  </body>
</html>
