<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stream Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html {
  height: 100%;
  height: -webkit-fill-available;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  width: 100%;
  height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#player-shell {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: #000;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  display: block;
}

#loading-screen {
  position: fixed; inset: 0; z-index: 100;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 20px;
}
.loader {
  position: relative;
  width: 52px; height: 52px;
}
.loader-ring {
  position: absolute; inset: 0;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.12);
  border-top-color: #0A84FF;
  animation: loader-spin .9s cubic-bezier(0.55,0.1,0.45,0.9) infinite;
}
@keyframes loader-spin { to { transform: rotate(360deg); } }
.loading-label {
  font-size: 13.5px;
  font-weight: 500;
  letter-spacing: .4px;
  color: rgba(255,255,255,.5);
}

#center-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  pointer-events: none;
}
.center-play-btn {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: none;
  background:
    linear-gradient(155deg, rgba(255,255,255,.22), rgba(255,255,255,.02) 60%),
    rgba(18,18,22,.44);
  -webkit-backdrop-filter: blur(22px) saturate(200%);
  backdrop-filter: blur(22px) saturate(200%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.34),
    inset 0 -7px 12px rgba(0,0,0,.24),
    0 14px 30px -10px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.07);
  display: none;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
}
[data-show-center] .center-play-btn { display: flex; }
.center-play-btn svg {
  width: 22px; height: 22px;
  margin-left: 3px;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.4));
}
.center-play-btn:hover, .center-play-btn:focus-visible {
  transform: scale(1.07);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -7px 12px rgba(0,0,0,.24),
    0 16px 34px -8px rgba(0,0,0,.65),
    0 0 0 1px rgba(10,132,255,.4),
    0 0 26px rgba(10,132,255,.28);
}
.center-play-btn:active { transform: scale(.9); }

#controls-bar {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 4;
  padding: 22px 16px 14px;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.75) 60%, rgba(0,0,0,.88) 100%);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity .28s ease, transform .28s ease;
  pointer-events: none;
}
#player-shell.controls-visible #controls-bar {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

#progress-track {
  position: relative;
  width: 100%;
  height: 4px;
  border-radius: 4px;
  background: rgba(255,255,255,.22);
  margin-bottom: 14px;
  cursor: pointer;
}
#progress-track.is-live-only { cursor: default; }
#progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  border-radius: 4px;
  background: #0A84FF;
}
#progress-thumb {
  position: absolute;
  top: 50%;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(10,132,255,.35);
  transform: translate(-50%, -50%);
  left: 0%;
  transition: opacity .2s ease;
}
#progress-track.is-live-only #progress-thumb { opacity: 0; }

#controls-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.player-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: rgba(255,255,255,.92);
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 8px;
  flex: none;
  transition: background .18s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
}
.player-btn:hover { background: rgba(255,255,255,.13); transform: translateY(-1px); }
.player-btn:active { transform: scale(.88); }
.player-btn:focus-visible {
  outline: 2px solid #0A84FF;
  outline-offset: 2px;
  background: rgba(255,255,255,.13);
}
.unmute-hint {
  color: #0A84FF;
  animation: unmute-glow 1.7s ease-in-out infinite;
}
@keyframes unmute-glow {
  0%, 100% { background: rgba(10,132,255,.08); box-shadow: 0 0 0 0 rgba(10,132,255,.4); }
  50% { background: rgba(10,132,255,.32); box-shadow: 0 0 0 7px rgba(10,132,255,0); }
}

.live-pill {
  appearance: none;
  border: none;
  cursor: default;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .6px;
  color: #ff5a5a;
  padding: 4px 9px 4px 6px;
  border-radius: 20px;
  background: rgba(255,69,69,.14);
  border: 1px solid rgba(255,69,69,.35);
  flex: none;
  transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #ff4545;
  animation: live-blink 1.4s infinite;
  flex: none;
}
@keyframes live-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: .3; }
}
.live-pill.is-behind {
  color: #ffb020;
  background: rgba(255,176,32,.14);
  border-color: rgba(255,176,32,.35);
  cursor: pointer;
}
.live-pill.is-behind:hover { background: rgba(255,176,32,.24); transform: translateY(-1px); }
.live-pill.is-behind .live-dot { background: #ffb020; animation: none; }
.live-pill.is-vod {
  color: rgba(255,255,255,.75);
  background: rgba(255,255,255,.08);
  border-color: rgba(255,255,255,.16);
}
.live-pill.is-vod .live-dot { display: none; }

.controls-spacer { flex: 1; }

#resizeBtn {
  width: auto;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .6px;
  color: rgba(255,255,255,.86);
}
#resizeBtn:hover { background: rgba(255,255,255,.16); }

#qualityMenu {
  position: absolute;
  right: 16px;
  bottom: 74px;
  z-index: 5;
  min-width: 150px;
  background: linear-gradient(165deg, rgba(34,34,40,.92), rgba(18,18,22,.92));
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  backdrop-filter: blur(24px) saturate(200%);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 16px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 260px;
  overflow-y: auto;
  box-shadow: 0 20px 45px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transform-origin: bottom right;
  transform: scale(.9) translateY(6px);
  opacity: 0;
  pointer-events: none;
  transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
}
#qualityMenu.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
.quality-menu-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  padding: 6px 10px 8px;
}
.quality-option {
  padding: 10px 12px;
  font-size: 13.5px;
  font-weight: 500;
  color: rgba(255,255,255,.78);
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background .15s ease, color .15s ease;
}
.quality-option:hover { background: rgba(255,255,255,.09); color: #fff; }
.quality-option.active { color: #0A84FF; font-weight: 700; background: rgba(10,132,255,.12); }
.quality-option.active::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #0A84FF;
  flex: none;
}

#error-screen {
  position: fixed; inset: 0; z-index: 80;
  background: #050608;
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
#error-screen.show { display: flex; }
.error-card {
  max-width: 420px; width: 100%;
  text-align: center;
}
.error-icon {
  width: 68px; height: 68px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.04);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 22px;
}
.error-icon svg { width: 32px; height: 32px; stroke: rgba(255,255,255,.5); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.error-title { font-size: 20px; font-weight: 700; color: #f0f0f0; margin-bottom: 10px; letter-spacing: .2px; }
.error-body { font-size: 13.5px; color: rgba(255,255,255,.4); line-height: 1.75; margin-bottom: 22px; }
.error-body code {
  display: block;
  margin-top: 10px;
  padding: 10px 14px;
  background: rgba(255,255,255,.06);
  border-radius: 8px;
  font-size: 12px;
  color: rgba(255,255,255,.55);
  word-break: break-all;
}
.error-retry-note {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  font-size: 12px; color: rgba(255,255,255,.32);
  margin-bottom: 24px;
}
.error-retry-dot { width: 6px; height: 6px; border-radius: 50%; background: #0A84FF; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
.error-retry-btn {
  appearance: none; border: none; cursor: pointer;
  padding: 12px 30px; border-radius: 50px;
  background: rgba(255,255,255,.09);
  border: 1.5px solid rgba(255,255,255,.16);
  color: #fff;
  font-size: 14px; font-weight: 600;
  letter-spacing: .3px;
  transition: background .2s ease, border-color .2s ease, transform .15s ease;
}
.error-retry-btn:hover, .error-retry-btn:focus-visible { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.28); }
.error-retry-btn:focus-visible { outline: 2px solid #0A84FF; outline-offset: 2px; }
.error-retry-btn:active { transform: scale(.96); }

@media (min-width: 1400px) {
  .player-btn { width: 42px; height: 42px; }
  .player-btn svg { transform: scale(1.15); }
  .center-play-btn { width: 76px; height: 76px; }
  .center-play-btn svg { width: 28px; height: 28px; }
  #controls-row { gap: 18px; }
  .live-pill, #resizeBtn { font-size: 13px; padding-top: 6px; padding-bottom: 6px; }
  #controls-bar { padding: 30px 26px 22px; }
}

@media (hover: none) {
  .player-btn:hover { background: transparent; }
  .error-retry-btn:hover { background: rgba(255,255,255,.09); }
}
</style>
</head>
<body>

<div id="player-shell">

  <video id="video" playsinline webkit-playsinline muted autoplay preload="auto"></video>

  <div id="center-overlay">
    <button type="button" id="centerPlayBtn" class="center-play-btn" aria-label="Play"></button>
  </div>

  <div id="controls-bar">
    <div id="progress-track">
      <div id="progress-fill"></div>
      <div id="progress-thumb"></div>
    </div>
    <div id="controls-row">
      <button type="button" id="playPauseBtn" class="player-btn" aria-label="Play"></button>
      <button type="button" id="muteBtn" class="player-btn" aria-label="Mute"></button>
      <button type="button" id="livePill" class="live-pill" aria-label="Live status"><span class="live-dot"></span><span id="livePillText">LIVE</span></button>
      <span class="controls-spacer"></span>
      <button type="button" id="resizeBtn" class="player-btn" aria-label="Resize">FIT</button>
      <button type="button" id="qualityBtn" class="player-btn" aria-label="Quality"></button>
      <button type="button" id="pipBtn" class="player-btn" aria-label="Picture in Picture"></button>
      <button type="button" id="fullscreenBtn" class="player-btn" aria-label="Fullscreen"></button>
    </div>
  </div>

  <div id="qualityMenu"></div>

</div>

<div id="loading-screen">
  <div class="loader"><div class="loader-ring"></div></div>
  <div class="loading-label">Loading stream…</div>
</div>

<div id="error-screen">
  <div class="error-card">
    <div class="error-icon" id="errorIcon">
      <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    </div>
    <div class="error-title" id="errorTitle">No Stream URL Provided</div>
    <div class="error-body" id="errorBody">
      Add a stream link using the <b>url</b> parameter.
      <code>?url=https://example.com/playlist.m3u8</code>
    </div>
    <div class="error-retry-note" id="errorRetryNote" style="display:none;">
      <span class="error-retry-dot"></span>
      <span>Retrying automatically</span>
    </div>
    <button type="button" class="error-retry-btn" id="errorRetryBtn">Retry Now</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  'use strict';

  var RETRY_DELAY_MS = 6000;
  var PLAYBACK_SAFETY_MS = 15000;
  var CONTROLS_HIDE_MS = 3200;
  var UNMUTE_HINT_MS = 4500;
  var LIVE_EDGE_TOLERANCE = 60;
  var SEEK_STEP_SECONDS = 10;

  var video = document.getElementById('video');
  var playerShell = document.getElementById('player-shell');
  var loadScreen = document.getElementById('loading-screen');
  var errScreen = document.getElementById('error-screen');
  var errIcon = document.getElementById('errorIcon');
  var errTitle = document.getElementById('errorTitle');
  var errBody = document.getElementById('errorBody');
  var errRetryNote = document.getElementById('errorRetryNote');
  var errRetryBtn = document.getElementById('errorRetryBtn');

  var centerOverlay = document.getElementById('center-overlay');
  var centerPlayBtn = document.getElementById('centerPlayBtn');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var muteBtn = document.getElementById('muteBtn');
  var resizeBtn = document.getElementById('resizeBtn');
  var qualityBtn = document.getElementById('qualityBtn');
  var qualityMenu = document.getElementById('qualityMenu');
  var pipBtn = document.getElementById('pipBtn');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var progressTrack = document.getElementById('progress-track');
  var progressFill = document.getElementById('progress-fill');
  var progressThumb = document.getElementById('progress-thumb');
  var livePill = document.getElementById('livePill');
  var livePillText = document.getElementById('livePillText');

  var ICON_PLAY  = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  var ICON_VOLUME = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>';
  var ICON_MUTE = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 5V4L8 9H4z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
  var ICON_PIP = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12.5" y="11.5" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>';
  var ICON_FS_ENTER = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/><path d="M15 20h5v-5"/></svg>';
  var ICON_FS_EXIT = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>';
  var ICON_GEAR = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.5 2.4a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.3-1a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.5-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3 1 2-3.4z"/></svg>';
  var ICON_ALERT = '<svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>';
  var ICON_LINK_OFF = '<svg viewBox="0 0 24 24"><path d="M9 15l6-6"/><path d="M13 5.5l1-1a3.5 3.5 0 0 1 5 5l-1 1"/><path d="M11 18.5l-1 1a3.5 3.5 0 0 1-5-5l1-1"/></svg>';

  centerPlayBtn.innerHTML = ICON_PLAY;
  playPauseBtn.innerHTML = ICON_PLAY;
  muteBtn.innerHTML = ICON_MUTE;
  qualityBtn.innerHTML = ICON_GEAR;
  pipBtn.innerHTML = ICON_PIP;
  fullscreenBtn.innerHTML = ICON_FS_ENTER;

  var loaderHidden = false;
  var safetyTimer = null;
  var retryTimer = null;
  var hls = null;
  var streamUrl = null;
  var resizeModes = ['fit', 'fill', 'normal'];
  var resizeIndex = 0;
  var controlsTimer = null;

  function extractStreamUrl() {
    var href = window.location.href;
    var idx = href.indexOf('?url=');
    if (idx === -1) { idx = href.indexOf('&url='); }
    if (idx === -1) { return null; }
    var raw = href.slice(idx + 5);
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }

  function hideLoader() {
    if (loaderHidden) return;
    loaderHidden = true;
    loadScreen.style.transition = 'opacity .35s';
    loadScreen.style.opacity = '0';
    setTimeout(function () { loadScreen.style.display = 'none'; }, 370);
  }

  function showError(type) {
    clearTimeout(safetyTimer);
    loadScreen.style.display = 'none';

    if (type === 'nourl') {
      errIcon.innerHTML = ICON_LINK_OFF;
      errTitle.textContent = 'No Stream URL Provided';
      errBody.innerHTML = 'Add a stream link using the <b>url</b> parameter.<code>?url=https://example.com/playlist.m3u8</code>';
      errRetryNote.style.display = 'none';
      errRetryBtn.style.display = 'none';
    } else {
      errIcon.innerHTML = ICON_ALERT;
      errTitle.textContent = 'Unable to Load Stream';
      errBody.innerHTML = 'The stream could not be loaded. It may be offline, invalid, or blocked from this network.';
      errRetryNote.style.display = 'flex';
      errRetryBtn.style.display = 'inline-block';
      scheduleRetry();
    }

    errScreen.classList.add('show');
  }

  function hideError() {
    errScreen.classList.remove('show');
    clearTimeout(retryTimer);
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () {
      if (streamUrl) { playStream(streamUrl); }
    }, RETRY_DELAY_MS);
  }

  errRetryBtn.addEventListener('click', function () {
    if (streamUrl) { playStream(streamUrl); }
  });

  function tryLandscape() {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function () {});
    }
  }
  function exitLandscape() {
    if (screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch (e) {}
    }
  }
  function onFSChange() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
    if (fsEl) { tryLandscape(); } else { exitLandscape(); }
    updateFullscreenIcon();
  }
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);
  document.addEventListener('mozfullscreenchange', onFSChange);
  document.addEventListener('MSFullscreenChange', onFSChange);
  video.addEventListener('webkitbeginfullscreen', tryLandscape);
  video.addEventListener('webkitendfullscreen', exitLandscape);

  function destroyHls() {
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    video.load();
  }

  function attemptPlay() {
    var p = video.play();
    if (p && p.catch) { p.catch(function () {}); }
  }

  function handleFatalError() {
    destroyHls();
    showError('load');
  }

  function buildQualityMenu(levels) {
    if (!levels || !levels.length) {
      qualityBtn.style.display = 'none';
      return;
    }
    qualityBtn.style.display = '';
    var items = [];
    for (var i = 0; i < levels.length; i++) {
      items.push({ idx: i, height: levels[i].height || 0 });
    }
    items.sort(function (a, b) { return b.height - a.height; });
    var html = '<div class="quality-menu-label">Quality</div>';
    html += '<div class="quality-option active" data-level="-1">Auto</div>';
    for (var j = 0; j < items.length; j++) {
      html += '<div class="quality-option" data-level="' + items[j].idx + '">' + items[j].height + 'p</div>';
    }
    qualityMenu.innerHTML = html;
  }

  function playStream(url) {
    clearTimeout(safetyTimer);
    hideError();
    destroyHls();
    qualityBtn.style.display = 'none';

    if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({
        enableWorker: true,
        maxBufferLength: 30,
        backBufferLength: 60,
        liveSyncDurationCount: 3
      });
      hls.on(window.Hls.Events.MANIFEST_PARSED, function (event, data) {
        buildQualityMenu(data.levels);
        attemptPlay();
      });
      hls.on(window.Hls.Events.ERROR, function (event, data) {
        if (data.fatal) { handleFatalError(); }
      });
      hls.loadSource(url);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', attemptPlay, { once: true });
    } else {
      showError('load');
      return;
    }

    safetyTimer = setTimeout(handleFatalError, PLAYBACK_SAFETY_MS);
  }

  function updatePlayIcon() {
    var icon = video.paused ? ICON_PLAY : ICON_PAUSE;
    playPauseBtn.innerHTML = icon;
    centerPlayBtn.innerHTML = icon;
    if (video.paused) { playerShell.setAttribute('data-show-center', ''); }
    else { playerShell.removeAttribute('data-show-center'); }
  }

  function togglePlay() {
    if (video.paused) { attemptPlay(); } else { video.pause(); }
  }
  playPauseBtn.addEventListener('click', togglePlay);
  centerPlayBtn.addEventListener('click', togglePlay);

  function updateMuteIcon() {
    muteBtn.innerHTML = (video.muted || video.volume === 0) ? ICON_MUTE : ICON_VOLUME;
  }
  muteBtn.addEventListener('click', function () {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) { video.volume = 1; }
    muteBtn.classList.remove('unmute-hint');
    updateMuteIcon();
  });

  function applyResizeMode() {
    var mode = resizeModes[resizeIndex];
    if (mode === 'fit') { video.style.objectFit = 'contain'; resizeBtn.textContent = 'FIT'; }
    else if (mode === 'fill') { video.style.objectFit = 'cover'; resizeBtn.textContent = 'FILL'; }
    else { video.style.objectFit = 'fill'; resizeBtn.textContent = 'NORMAL'; }
  }
  resizeBtn.addEventListener('click', function () {
    resizeIndex = (resizeIndex + 1) % resizeModes.length;
    applyResizeMode();
  });
  applyResizeMode();

  qualityBtn.addEventListener('click', function () {
    qualityMenu.classList.toggle('open');
  });
  qualityMenu.addEventListener('click', function (e) {
    var opt = e.target.closest('.quality-option');
    if (!opt || !hls) return;
    hls.currentLevel = parseInt(opt.getAttribute('data-level'), 10);
    qualityMenu.classList.remove('open');
    var all = qualityMenu.querySelectorAll('.quality-option');
    for (var i = 0; i < all.length; i++) { all[i].classList.remove('active'); }
    opt.classList.add('active');
  });

  function updatePipAvailability() {
    var standard = document.pictureInPictureEnabled && !video.disablePictureInPicture;
    var iosMode = typeof video.webkitSupportsPresentationMode === 'function' && video.webkitSupportsPresentationMode('picture-in-picture');
    if (!standard && !iosMode) { pipBtn.style.display = 'none'; }
  }
  pipBtn.addEventListener('click', function () {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(function () {});
      return;
    }
    if (video.requestPictureInPicture) {
      video.requestPictureInPicture().catch(function () {
        if (typeof video.webkitSetPresentationMode === 'function') {
          video.webkitSetPresentationMode('picture-in-picture');
        }
      });
    } else if (typeof video.webkitSetPresentationMode === 'function') {
      video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
    }
  });

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  function requestFs(el) {
    if (el.requestFullscreen) return el.requestFullscreen();
    if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
    if (el.msRequestFullscreen) return el.msRequestFullscreen();
    return Promise.reject(new Error('unsupported'));
  }
  function exitFs() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
    if (document.msExitFullscreen) return document.msExitFullscreen();
    return Promise.resolve();
  }
  function updateFullscreenIcon() {
    fullscreenBtn.innerHTML = isFullscreen() ? ICON_FS_EXIT : ICON_FS_ENTER;
  }
  function toggleFullscreen() {
    if (isFullscreen()) { exitFs(); return; }
    var req = requestFs(playerShell);
    if (req && req.catch) {
      req.catch(function () {
        if (typeof video.webkitEnterFullscreen === 'function') { video.webkitEnterFullscreen(); }
      });
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);

  function showControls() {
    playerShell.classList.add('controls-visible');
    clearTimeout(controlsTimer);
    if (!video.paused) {
      controlsTimer = setTimeout(function () {
        playerShell.classList.remove('controls-visible');
        qualityMenu.classList.remove('open');
      }, CONTROLS_HIDE_MS);
    }
  }
  video.addEventListener('click', showControls);
  playerShell.addEventListener('mousemove', showControls);
  playerShell.addEventListener('touchstart', showControls, { passive: true });
  playerShell.addEventListener('focusin', showControls);

  function getLiveEdge() {
    if (hls && typeof hls.liveSyncPosition === 'number' && isFinite(hls.liveSyncPosition)) {
      return hls.liveSyncPosition;
    }
    if (video.seekable && video.seekable.length) {
      return video.seekable.end(video.seekable.length - 1);
    }
    if (isFinite(video.duration)) { return video.duration; }
    return null;
  }

  function formatBehind(seconds) {
    var s = Math.max(0, Math.round(seconds));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return '-' + m + ':' + (r < 10 ? '0' + r : r);
  }

  function formatClock(seconds) {
    if (!isFinite(seconds) || seconds < 0) { seconds = 0; }
    var s = Math.round(seconds);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var r = s % 60;
    var mm = (h > 0 && m < 10 ? '0' + m : String(m));
    var rr = (r < 10 ? '0' + r : String(r));
    return h > 0 ? (h + ':' + mm + ':' + rr) : (m + ':' + rr);
  }

  function updateLiveStatus() {
    var isLive = !video.duration || !isFinite(video.duration);
    livePill.classList.toggle('is-vod', !isLive);
    if (!isLive) {
      livePill.classList.remove('is-behind');
      livePillText.textContent = formatClock(video.currentTime) + ' / ' + formatClock(video.duration);
      return;
    }
    var edge = getLiveEdge();
    var behind = (edge !== null) ? (edge - video.currentTime) : 0;
    if (behind <= LIVE_EDGE_TOLERANCE) {
      livePill.classList.remove('is-behind');
      livePillText.textContent = 'LIVE';
    } else {
      livePill.classList.add('is-behind');
      livePillText.textContent = formatBehind(behind);
    }
  }
  livePill.addEventListener('click', function () {
    if (!livePill.classList.contains('is-behind')) return;
    var edge = getLiveEdge();
    if (edge !== null) { video.currentTime = edge; }
  });

  function updateProgress() {
    if (!video.duration || !isFinite(video.duration)) {
      progressFill.style.width = '100%';
      progressTrack.classList.add('is-live-only');
      return;
    }
    progressTrack.classList.remove('is-live-only');
    var ratio = video.currentTime / video.duration;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
  }

  function seekFromEvent(e) {
    if (!video.duration || !isFinite(video.duration)) return;
    var rect = progressTrack.getBoundingClientRect();
    var clientX = e.touches && e.touches.length ? e.touches[0].clientX : e.clientX;
    var ratio = (clientX - rect.left) / rect.width;
    ratio = Math.min(1, Math.max(0, ratio));
    video.currentTime = ratio * video.duration;
  }
  progressTrack.addEventListener('click', seekFromEvent);

  function seekBy(delta) {
    if (!video.duration || !isFinite(video.duration)) return;
    var next = video.currentTime + delta;
    next = Math.max(0, Math.min(video.duration, next));
    video.currentTime = next;
  }

  document.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;

    if (e.key === ' ' || e.key === 'Enter' || e.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== video) return;
      e.preventDefault();
      togglePlay();
      showControls();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      seekBy(-SEEK_STEP_SECONDS);
      showControls();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      seekBy(SEEK_STEP_SECONDS);
      showControls();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      video.volume = Math.min(1, video.volume + 0.1);
      video.muted = false;
      showControls();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      video.volume = Math.max(0, video.volume - 0.1);
      showControls();
    } else if (e.key === 'm' || e.key === 'M') {
      video.muted = !video.muted;
      updateMuteIcon();
      showControls();
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
    }
  });

  video.addEventListener('playing', function () {
    clearTimeout(safetyTimer);
    hideLoader();
    showControls();
  });
  video.addEventListener('play', updatePlayIcon);
  video.addEventListener('pause', updatePlayIcon);
  video.addEventListener('volumechange', updateMuteIcon);
  video.addEventListener('timeupdate', updateProgress);
  video.addEventListener('timeupdate', updateLiveStatus);
  video.addEventListener('progress', updateProgress);
  video.addEventListener('progress', updateLiveStatus);
  video.addEventListener('loadedmetadata', updatePipAvailability);

  muteBtn.classList.add('unmute-hint');
  setTimeout(function () { muteBtn.classList.remove('unmute-hint'); }, UNMUTE_HINT_MS);

  streamUrl = extractStreamUrl();
  if (!streamUrl) {
    showError('nourl');
  } else {
    playStream(streamUrl);
  }

})();
</script>
</body>
</html>
